<title>mDenseOn / mLateOn — BEIR</title>
<!--
  Card for the mDenseOn/mLateOn post. The claim is narrow on purpose: does going
  multilingual cost anything in English? BEIR is the only board where both the
  multilingual model and the English-only model it extends have complete coverage, so it
  is the only place a before/after comparison is honest. Two paired rows, each showing the
  English-only model's rank/score directly above the multilingual model that replaces it —
  same visual language as the ColVec1.1 "prior generation" treatment, but the comparison
  runs the other direction: here the accent-coloured bar (multilingual) is expected to be
  worse and isn't, so the finding is the *absence* of a gap rather than a lead.

  An earlier version of this card also showed CoIR and MTEB(Code, v1), where the
  English-only models have no complete-coverage row at all — context, not comparison.
  Dropped: with no baseline to show, that zone was answering a question nobody asked and
  competing with the one real finding for the reader's attention.

    uv run posts/3-review/mdenseon-mlateon/fetch.py
    uv run mteb-render --card posts/3-review/mdenseon-mlateon/card-1-mdenseon-mlateon.html \
      --out posts/3-review/mdenseon-mlateon/card-1-mdenseon-mlateon.png

  PALETTE IS A PLACEHOLDER — swap the :root block only.
-->

</script>
<script type="text/plain" id="alt-text">
New models on MTEB: mDenseOn & mLateOn — Going multilingual did not come at the cost of English retrieval quality (BEIR). On BEIR, English retrieval (15 tasks, 197 models with complete coverage): lightonai/mLateOn ranks 23 of 197 at 57.56, ahead of lightonai/LateOn, which ranks 25 of 197 at 57.22 (+0.34 for the multilingual model); lightonai/mDenseOn ranks 28 of 197 at 56.70, ahead of lightonai/DenseOn, which ranks 31 of 197 at 56.20 (+0.50 for the multilingual model). Added by NohTow, results by paulomouraj. Source: MTEB, leaderboard.mteb.org.
</script>

  <span id="footer"></span>
</footer>

<script>
const COPY = {
  eyebrow: "New models on MTEB",
  title: "mDenseOn & mLateOn",
  specs: "LightOn · multilingual extensions of DenseOn and LateOn, 8 languages plus English",
  subtitle: "Going multilingual did not come at the cost of English retrieval quality (BEIR)",
  footer: "Added by NohTow, results by paulomouraj",
};

const d = { ...COPY, ...JSON.parse(document.getElementById("card-data").textContent) };
const set = (id, v) => { const n = document.getElementById(id); if (n) n.textContent = v ?? ""; };
set("eyebrow", d.eyebrow); set("title", d.title); set("specs", d.specs);
set("subtitle", d.subtitle); set("footer", d.footer);
if (d.mode === "dark") document.documentElement.dataset.mode = "dark";

const splitName = m => {
  const i = m.indexOf("/");
  return i === -1 ? ["", m] : [m.slice(0, i + 1), m.slice(i + 1)];
};
const AXIS_MAX = Math.ceil(Math.max(
  ...d.comparisons.flatMap(c => [c.multilingual_place.score, c.base_place.score])
) / 10) * 10;

document.getElementById("pairs").innerHTML = d.comparisons.map(c => {
  const [mOrg, mName] = splitName(c.multilingual);
  const [bOrg, bName] = splitName(c.base);
  const mPct = (c.multilingual_place.score / AXIS_MAX * 100).toFixed(2);
  const bPct = (c.base_place.score / AXIS_MAX * 100).toFixed(2);
  return `
    <div class="pair">
      <div class="pair-row multi">
        <span class="pair-role">Multilingual</span>
        <span class="pair-name"><span class="org">${mOrg}</span>${mName}</span>
        <span class="pair-val">${c.multilingual_place.score.toFixed(2)}<span class="pair-rank">rank ${c.multilingual_place.rank} of ${c.multilingual_place.of}</span></span>
        <div class="pair-track"><div class="pair-fill" style="width:${mPct}%"></div></div>
      </div>
      <div class="pair-row base">
        <span class="pair-role">English-only</span>
        <span class="pair-name"><span class="org">${bOrg}</span>${bName}</span>
        <span class="pair-val">${c.base_place.score.toFixed(2)}<span class="pair-rank">rank ${c.base_place.rank} of ${c.base_place.of}</span></span>
        <div class="pair-track"><div class="pair-fill" style="width:${bPct}%"></div></div>
      </div>
      <div class="pair-delta">+${c.delta.toFixed(2)} for going multilingual, not a cost</div>
    </div>`;
}).join("");

window.__altText = [
  `${d.eyebrow}: ${d.title} — ${d.subtitle}.`,
  `On BEIR, English retrieval (${d.n_comparison_tasks} tasks, ${d.n_comparison_complete} models with complete coverage): ` +
    d.comparisons.map(c =>
      `${c.multilingual} ranks ${c.multilingual_place.rank} of ${c.multilingual_place.of} at ${c.multilingual_place.score.toFixed(2)}, `
      + `ahead of ${c.base}, which ranks ${c.base_place.rank} of ${c.base_place.of} at ${c.base_place.score.toFixed(2)} `
      + `(+${c.delta.toFixed(2)} for the multilingual model)`
    ).join("; ") + ".",
  `${d.footer}. Source: MTEB, leaderboard.mteb.org.`,
].join(" ");
</script>
