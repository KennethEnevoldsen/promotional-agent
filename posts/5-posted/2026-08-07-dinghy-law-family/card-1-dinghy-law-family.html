  * { margin: 0; padding: 0; box-sizing: border-box; }

    border: 1px solid var(--hairline); border-radius: 50%;
    width: 32px; height: 32px; line-height: 30px;
  }
  .row.subject .rank { color: var(--accent); border-color: var(--accent); font-weight: 650; }

  /* Three lines: org, model, size. Splitting them stops the long HF names wrapping
     mid-word and gives the parameter counts somewhere to live that is not a caption
     tacked onto the end of the name. */
  .mname { line-height: 1.2; }
  .mname .org { display: block; color: var(--text-muted); font-size: 15px; }
  .mname .name { display: block; font-size: 20px; color: var(--text-secondary); }
  .row.subject .mname .name { color: var(--text-primary); font-weight: 640; }
  .mname .size { display: block; color: var(--text-muted); font-size: 15px; }

  .track { height: 40px; position: relative; }
  .fill {
    position: absolute; left: 0; top: 0; bottom: 0;
    background: var(--peer); border-radius: 0 5px 5px 0;   /* rounded data-end */
  }
  .row.subject .fill { background: var(--accent); }
  .val { font-size: 23px; color: var(--text-secondary); text-align: right; }
  .row.subject .val { color: var(--text-primary); font-weight: 640; }


  .axis { margin-top: 8px; padding-top: 6px; row-gap: 4px; }
  .axis .ticks { position: relative; height: 16px; }
  .axis .ticks span {
    position: absolute; transform: translateX(-50%);
    font-size: 16px; color: var(--text-muted);
  }
  .axis .rule { grid-column: 3 / 4; height: 1px; background: var(--axis); }
  .axis-name { font-size: 17px; color: var(--text-secondary); font-weight: 550; text-align: center; }
  .grid { stroke: var(--gridline); stroke-width: 1; }
  .axis-line { stroke: var(--axis); stroke-width: 1; }
  .tick { fill: var(--text-muted); font-size: 15px; }
  .axis-title { fill: var(--text-secondary); font-size: 16px; font-weight: 550; }
  /* No surface ring on either dot: it was there to separate overlapping marks, but the
     points are well spread and over the shaded region the ring reads as a white halo. */
  .peer-dot { fill: var(--peer); }
  .subject-dot { fill: var(--accent); }
  .subject-label { fill: var(--text-primary); font-size: 18px; font-weight: 640; }
  .subject-org { fill: var(--text-secondary); font-size: 12px; }
  .subject-score { fill: var(--text-secondary); font-size: 17px; }
  .peer-label { fill: var(--text-muted); font-size: 14px; }
  .peer-org { fill: var(--text-muted); font-size: 10.5px; opacity: 0.8; }
  /* The frontier is drawn as a region, not a line: its top edge IS the boundary, so a
     separate stroke along it only restates what the shading already says. Slightly
     stronger than a pure background tint because it is now the sole marker. */
  .frontier-fill { fill: var(--accent); opacity: 0.09; stroke: none; }
  .zero-note { fill: var(--text-muted); font-size: 13px; font-style: italic; }

  footer {
    display: flex; justify-content: space-between; align-items: flex-end;
    margin-top: 12px; padding-top: 14px; border-top: 1px solid var(--hairline);
    font-size: 17px; color: var(--text-muted);
  }
  .foot-left { display: flex; flex-direction: column; gap: 5px; }
  footer .context { color: var(--text-secondary); font-weight: 550; }
  .source { font-size: 14px; color: var(--text-muted); }

  /* The dots icon is multi-colour with transparency, so it is drawn as an image rather
     than a mask — masking would flatten its blues to a single ink and lose the mark.
     Its own blues read on both surfaces, so no per-mode variant is needed. Embedded as
     a data URI because render.py renders from a temp directory, where a relative path
     would not resolve. */
  .logo {
    width: 39px; height: 41px; flex: none;   /* asset aspect 0.958 */
    background: var(--logo-uri) left center / contain no-repeat;
  }
</style>

<header>
  <div>
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="title"></h1>
    <!-- specs above the headline: the hard facts (languages, context, dims) frame the
         claim rather than trailing it as a footnote -->
    <div class="specs" id="specs"></div>
    <div class="subtitle" id="subtitle"></div>
  </div>
  <!-- Brand block, top right on every post. Replaces the legend: the subtitle already
       names the Pareto frontier, each dot carries its own model name, and the subjects
       are the only ones in accent with a score beside them — so the legend was
       restating what the card says elsewhere. -->
  <div class="brand">
    <span class="logo" role="img" aria-label="MTEB"></span>
    <span class="brand-name">MTEB</span>
  </div>
</header>

<div class="plot">
  <div class="bars" id="bars"></div>
  <div class="axis" id="axis"></div>
</div>

<footer>
  <!-- The cohort statement is no longer printed on the card. It still reaches the alt
       text, which describes the plot as covering N multilingual models under the size
       cap, so the scope survives for anyone reading the description. -->
  <div class="foot-left">
    <span class="source">Source · MTEB (leaderboard.mteb.org)</span>
  </div>
  <span id="footer"></span>
</footer>


<script>
const COPY = {
  eyebrow: "New model on MTEB",
  title: "dinghy-law",
  specs: "Specialised legal embedding models from Hanno-Labs · 0.6B and 4B",
  subtitle: "1st and 4th on MTEB(Law, v1)",
  footer: "Contributed by trashhalo",
  // states the selection: without this the ranking could be any subset
  axis_label: "MTEB(Law, v1) · top 8 of 159 models with complete results",
};

const d = { ...COPY, ...JSON.parse(document.getElementById("card-data").textContent) };
const set = (id, v) => { const n = document.getElementById(id); if (n) n.textContent = v ?? ""; };
set("eyebrow", d.eyebrow); set("title", d.title); set("subtitle", d.subtitle);
set("specs", d.specs); set("footer", d.footer);
if (d.mode === "dark") document.documentElement.dataset.mode = "dark";

const rows = d.rows;
// Zero baseline: bars encode length, and these scores sit on a 0-100 scale where zero
// is meaningful. Truncating would turn a 6-point spread into an apparent chasm.
const AXIS_MAX = Math.ceil(Math.max(...rows.map(r => r.score)) / 20) * 20;

const splitName = n => {
  const i = n.indexOf("/");
  return i === -1 ? ["", n] : [n.slice(0, i + 1), n.slice(i + 1)];
};
// Two significant figures: 4.028B is false precision on a card, and the comparison
// being made is order-of-magnitude. Proprietary models report no size at all — say
// "proprietary" rather than printing a zero or an empty gap.
const fmtB = b => b >= 10 ? `${b.toFixed(0)}B` : `${b.toFixed(1)}B`;
const sizeLine = r => r.proprietary ? "proprietary" : r.params ? `${fmtB(r.params)} parameters` : "size not published";

document.getElementById("bars").innerHTML = rows.map((r, i) => {
  const [org, name] = splitName(r.model);
  const cls = r.subject ? " subject" : "";
  return `
    <div class="row${cls}">
      <span class="rank">${i + 1}</span>
      <span class="mname">
        <span class="org">${org}</span>
        <span class="name">${name}</span>
        <span class="size">${sizeLine(r)}</span>
      </span>
      <span class="track"><span class="fill" style="width:${(r.score / AXIS_MAX * 100).toFixed(2)}%"></span></span>
      <span class="val">${r.score.toFixed(2)}</span>
    </div>`;
}).join("");

const ticks = [];
for (let v = 0; v <= AXIS_MAX; v += 20) ticks.push(v);
document.getElementById("axis").innerHTML = `
  <span></span><span></span>
  <span class="ticks">${ticks.map(v =>
    `<span style="left:${(v / AXIS_MAX * 100).toFixed(2)}%">${v}</span>`).join("")}</span>
  <span></span>
  <span></span><span></span>
  <span class="axis-name">${d.axis_label}</span>
  <span></span>`;

window.__altText = [
  `${d.eyebrow}: ${d.title} — ${d.subtitle}.`,
  `Bar chart of the top ${rows.length} models on ${d.benchmark} (${d.n_tasks} tasks), out of ${d.n_models} models with complete results.`,
  rows.map((r, i) => `${i + 1}. ${r.model}, ${r.score.toFixed(2)}, ${sizeLine(r)}`).join("; ") + ".",
  `${d.footer}. Source: MTEB, leaderboard.mteb.org.`,
].join(" ");
</script>
