  default shape: recommend_chart() returns "bars" whenever there is no size-efficiency
  frontier and no single rival close enough for a radar. A ranked list is always
  defensible and needs no story beyond "here is where it lands."

  Copy this file into the new post's folder as card-N-<slug>.html, fill in COPY below,
  and write #card-data with mtebpost.model_release.bars_card_data(cohort, prior=[...]).
  Three row roles: subject (this release), prior (same lab, previous generation — the
  within-lab comparison a post can lead with), and plain peer. The full top N is shown
  rather than skipping rows, because the skipped ranks are the real competition and
  cutting them makes a generational jump look like the only story on the board.

    uv run posts/<stage>/<id>/fetch.py
    uv run mteb-render --card posts/<stage>/<id>/card-N-<slug>.html \
      --out posts/<stage>/<id>/card-N-<slug>.png

  Post 1 of 2. This card is one architecture only: the 13 models on ViDoRe(v2) that
  produce a single vector per document. That is the cohort the post's first claim is
  about, and a reader can check the claim by counting rows. The other 37 models on the
  board use late interaction and are the subject of card 2 — the axis line says so, so
  this card cannot be read as the whole board even travelling on its own.

  All 13 rows, not a top N: the low end is CLIP-family general-purpose models rather than
  document retrievers, and cutting them would hide how much of this cohort's range comes
  from models that were never built for the task.
-->

<script>
const COPY = {
  eyebrow: "New model on MTEB",
  title: "google/gemini-embedding-2",
  specs: "Proprietary \u00b7 interleaved text, image, audio and video input \u00b7 first MTEB results",
  subtitle: "First of the 13 single-vector models on ViDoRe(v2)",
  footer: "Model and results by whybe-choi",
  axis_label: "ViDoRe(v2)",
  axis_note: "4 tasks \u00b7 all 13 single-vector models with complete results",
};

const d = { ...COPY, ...JSON.parse(document.getElementById("card-data").textContent) };
const set = (id, v) => { const n = document.getElementById(id); if (n) n.textContent = v ?? ""; };
set("eyebrow", d.eyebrow); set("title", d.title); set("subtitle", d.subtitle);
set("specs", d.specs); set("footer", d.footer);
if (d.mode === "dark") document.documentElement.dataset.mode = "dark";

const rows = d.rows;
const AXIS_MAX = Math.ceil(Math.max(...rows.map(r => r.score)) / 20) * 20;

const splitName = n => {
  const i = n.indexOf("/");
  return i === -1 ? ["", n] : [n.slice(0, i + 1), n.slice(i + 1)];
};
// `params` is in the same unit fetch.py chose (active or total parameter count, in
// whichever scale — bars_card_data() passes raw counts, so format from a count here).
const fmtSize = n => n == null ? "size not published"
  : n === 0 ? "static (no active parameters)"
  : n >= 1e9 ? `${(n/1e9).toFixed(n >= 1e10 ? 0 : 1)}B parameters`
  : n >= 1e6 ? `${(n/1e6).toFixed(0)}M parameters`
  : `${(n/1e3).toFixed(0)}K parameters`;
// Rank is the position among single-vector models, which is what this card ranks; the
// board rank is card 2's subject. Everything here is one architecture, so no row needs
// to say which — the axis line says it once.
const tagLine = r => (r.subject ? "this release" : "");

document.getElementById("bars").innerHTML = rows.map((r, i) => {
  const [org, name] = splitName(r.model);
  const cls = r.subject ? " subject" : r.prior ? " prior" : "";
  const tag = tagLine(r);
  return `
    <div class="row${cls}">
      <span class="rank">${r.rank ?? i + 1}</span>
      <span class="mname">
        <span class="org">${org}</span>
        <span class="name">${name}</span>
        <span class="size">${fmtSize(r.params)}</span>
        ${tag ? `<span class="tag">${tag}</span>` : ""}
      </span>
      <span class="track"><span class="fill" style="width:${(r.score / AXIS_MAX * 100).toFixed(2)}%"></span></span>
      <span class="val">${r.score.toFixed(2)}</span>
    </div>`;
}).join("");

const ticks = [];
for (let v = 0; v <= AXIS_MAX; v += 20) ticks.push(v);
document.getElementById("axis").innerHTML = `
  <span></span><span></span>
  <span class="ticks">${ticks.map(v =>
    `<span style="left:${(v / AXIS_MAX * 100).toFixed(2)}%">${v}</span>`).join("")}</span>
  <span></span>
  <span></span><span></span>
  <span><span class="axis-name">${d.axis_label}</span>
        <span class="axis-note">${d.axis_note}</span></span>
  <span></span>`;

window.__altText = [
  `${d.eyebrow}: ${d.title} — ${d.subtitle}.`,
  // "top N" only reads correctly when the rows are the top N. A subject appended from
  // outside top_n makes that false, so the count describes the rows and the per-row
  // ranks carry the positions.
  `Bar chart of ${rows.length} of the ${d.n_models} models with complete results on ${d.benchmark} (${d.n_tasks} tasks), each row given with its rank on that board.`,
  rows.map((r, i) => {
    const tag = tagLine(r);
    return `${r.rank ?? i + 1}. ${r.model}, ${r.score.toFixed(2)}, ${fmtSize(r.params)}${tag ? ` (${tag})` : ""}`;
  }).join("; ") + ".",
  `${d.footer}. Source: MTEB, leaderboard.mteb.org.`,
].join(" ");
</script>
