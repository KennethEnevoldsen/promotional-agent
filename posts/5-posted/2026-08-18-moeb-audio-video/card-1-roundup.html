<title>MOEB audio & video expansion</title>
<!--
  Card for the MOEB audio/video roundup. Not a plot — the first version was a sorted bar
  list of task-count-per-PR, and that axis turned out to be measuring an implementation
  detail (how many bidirectional-pair task classes one PR happened to register), not
  anything a reader would care about. Replaced with six featured tasks, one per subdomain
  (music, speech, environmental, cross-modal audio-scene, video retrieval, video QA),
  each carrying its own real description and an APA citation for its source paper. This
  answers "what did MTEB actually gain" instead of "how many classes did PR #X add".

  The fourth stat tile — N of 16 pull requests cite a published paper — exists because
  "these are real, documented datasets" is a checkable claim, not a vibe, and this account
  states checkable things rather than asserting quality. Both the modality split and the
  paper count come from each task's own `modalities`/`reference` fields, not a hand typed
  label — an earlier version of this card had MIAO mistagged "video" (it's audio+image)
  purely because of a manual label nobody re-checked against the code.

  Renamed card.html -> card-1-roundup.html: this is post 1/3 of a thread, and
  publish.py's card_for() matches card-N-*.png to post N by filename, so a thread's
  cards need the number even when — as here — only one part of the thread carries an
  image at all (posts 2/3 and 3/3 are text-only; card_for() treats a thread part with
  no matching numbered card as deliberately image-less, same as media: none).

    uv run posts/3-review/moeb-audio-video/fetch.py
    uv run mteb-render --card posts/3-review/moeb-audio-video/card-1-roundup.html \
      --out posts/3-review/moeb-audio-video/card-1-roundup.png

  PALETTE IS A PLACEHOLDER — swap the :root block only.
-->

MTEB expands: 25 new audio & video tasks. 16 pull requests, 20–30 Jul 2026. 18 audio tasks, 7 video tasks, across 16 pull requests. 10 of 16 cite a published paper. Featured: Music — Song Describer: Text-to-music retrieval: the query is a caption and the goal is to retrieve the music track it describes from the corpus of 706 recordings. (Manco et al. (2023)) Speech — SPEECH-COCO: Queries are spoken captions and the corpus contains the images; the goal is to retrieve the image described by the spoken caption. (Havard et al. (2017)) Environmental sound — SoundingEarth: Queries are field recordings and the corpus contains the aerial images; the goal is to retrieve the image of the location where the recording was made. (Heidler et al. (2023)) Audio scene — CASTELLA: Retrieval on CASTELLA, the human-annotated long-audio benchmark used as the DCASE 2026 Task 6 evaluation set: given a caption describing a moment, retrieve the full recording (1 to 5 minutes) that contains it. The corpus is the 566 complete recordings and there are 1,347 caption queries, each with its source recording as the single relevant document. Adapted from CASTELLA's audio moment localization task, which regresses a continuous time interval, to whole-recording retrieval for the mteb ranking format. (Munakata et al. (2025)) Video retrieval — MomentSeeker: Queries combine a text question with a reference image, e.g. asking what happened around the pictured moment. (Yuan et al. (2025)) Video QA — MMVU: MMVU is an expert-level, multi-discipline video understanding benchmark with questions spanning 27 subjects across Science, Healthcare, Humanities & Social Sciences, and Engineering. Each multiple-choice example pairs a specialized-domain video with a question and 5 candidate answers. The task is formulated as multiple-choice retrieval: given the (video, question) pair, retrieve the correct candidate. Used the public validation multiple-choice subset (~625 examples). (Zhao et al. (2025)) Credit by task count: dukesun99 (14 tasks) · wissam-sib (9) · Rakshitha-Ireddi (2). Source: MTEB, leaderboard.mteb.org.

<script>
const COPY = {
  eyebrow: "MTEB expands",
  title: "25 new audio & video tasks",
  subtitle: "16 pull requests, 20–30 Jul 2026",
  footer: "dukesun99 (14 tasks) · wissam-sib (9) · Rakshitha-Ireddi (2)",
};

const SUBDOMAIN_LABEL = {
  "music": "Music", "speech": "Speech", "environmental": "Environmental sound",
  "audio-scene": "Audio scene", "video-retrieval": "Video retrieval", "video-qa": "Video QA",
};

const d = { ...COPY, ...JSON.parse(document.getElementById("card-data").textContent) };
const set = (id, v) => { const n = document.getElementById(id); if (n) n.textContent = v ?? ""; };
set("eyebrow", d.eyebrow); set("title", d.title); set("subtitle", d.subtitle); set("footer", d.footer);
if (d.mode === "dark") document.documentElement.dataset.mode = "dark";

document.getElementById("tiles").innerHTML = `
  <div class="tile audio"><div class="tile-n">${d.by_modality.audio}</div><div class="tile-label">audio tasks</div></div>
  <div class="tile video"><div class="tile-n">${d.by_modality.video}</div><div class="tile-label">video tasks</div></div>
  <div class="tile"><div class="tile-n">${d.n_prs}</div><div class="tile-label">pull requests</div></div>
  <div class="tile"><div class="tile-n">${d.n_papers}/${d.n_prs}</div><div class="tile-label">cite a published paper</div></div>
`;

// Word-boundary truncation: descriptions come straight from each task's own metadata and
// vary a lot in length (CASTELLA's runs ~500 characters); clipped here for layout, not in
// the evidence file, so data.json keeps the full text.
const clip = (s, max) => {
  if (s.length <= max) return s;
  const cut = s.slice(0, max);
  return cut.slice(0, cut.lastIndexOf(" ")) + "…";
};

document.getElementById("list").innerHTML = d.featured.map(f => `
    <div class="item">
      <div class="item-bar ${f.modality}"></div>
      <div>
        <div class="item-head">
          <span class="item-subdomain ${f.modality}">${SUBDOMAIN_LABEL[f.subdomain]}</span>
          <span class="item-dataset">${f.dataset}</span>
        </div>
        <div class="item-desc">${clip(f.description, 175)}</div>
        <div class="item-cite">${f.citation}${f.license ? " · " + f.license : ""}</div>
      </div>
    </div>`
).join("");

window.__altText = [
  `${d.eyebrow}: ${d.title}. ${d.subtitle}.`,
  `${d.by_modality.audio} audio tasks, ${d.by_modality.video} video tasks, across ${d.n_prs} pull requests. ${d.n_papers} of ${d.n_prs} cite a published paper.`,
  `Featured: ` +
    d.featured.map(f => `${SUBDOMAIN_LABEL[f.subdomain]} — ${f.dataset}: ${f.description} (${f.citation})`).join(" "),
  `Credit by task count: ${d.footer}.`,
  `Source: MTEB, leaderboard.mteb.org.`,
].join(" ");
</script>
