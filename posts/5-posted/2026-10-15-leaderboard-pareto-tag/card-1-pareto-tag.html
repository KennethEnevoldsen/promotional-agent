    --surface:        #fcfcfb;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --accent:         #3d7bff;
    --peer:           #c9c7c0;
    --gridline:       #e1e0d9;
    --axis:           #c3c2b7;
    --hairline:       rgba(11, 11, 11, 0.10);
    --font-sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  [data-mode="dark"] {
    --surface:        #1a1a19;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --accent:         #5b8fff;
    --peer:           #55534e;
    --gridline:       #2c2c2a;
    --axis:           #383835;
    --hairline:       rgba(255, 255, 255, 0.10);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 1200px; overflow: hidden;
    background: var(--surface); color: var(--text-primary);
    font-family: var(--font-sans);
    display: flex; flex-direction: column;
    padding: 44px 56px 30px;
  }
  header { display: flex; justify-content: space-between; align-items: flex-start; }
  .eyebrow { font-size: 18px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--accent); }
  h1 { font-size: 44px; font-weight: 640; letter-spacing: -0.02em; margin-top: 10px; }
  .subtitle { font-size: 21px; color: var(--text-secondary); margin-top: 6px; }
  .brand { display: flex; align-items: center; gap: 12px; padding-top: 4px; }
  .brand-name { font-size: 30px; font-weight: 700; letter-spacing: 0.01em; }
  .logo { width: 39px; height: 41px; flex: none; background: var(--logo-uri) left center / contain no-repeat; }

  .plot { height: 500px; margin-top: 14px; }
  svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .grid { stroke: var(--gridline); stroke-width: 1; }
  .axis-line { stroke: var(--axis); stroke-width: 1; }
  .tick { fill: var(--text-muted); font-size: 15px; }
  .axis-title { fill: var(--text-secondary); font-size: 16px; font-weight: 550; }
  .zero-note { fill: var(--text-muted); font-size: 13px; font-style: italic; }
  .peer-dot { fill: var(--peer); }
  .fline { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; opacity: 0.55; }
  .tag-dot { fill: var(--accent); }
  .tag-num { fill: #fff; font-size: 14px; font-weight: 700; }

  table { width: 100%; border-collapse: collapse; margin-top: 18px; font-size: 17px; }
  th { text-align: left; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
       color: var(--text-muted); padding: 0 8px 6px; border-bottom: 1px solid var(--hairline); }
  td { padding: 5px 8px; border-bottom: 1px solid var(--hairline); white-space: nowrap; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.idx span { display: inline-block; width: 24px; height: 24px; border-radius: 12px; background: var(--accent);

  td.model .org { color: var(--text-muted); }
  td.rank { font-weight: 640; }

  footer { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--hairline);

<header>
  <div>
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="title"></h1>
    <div class="subtitle" id="subtitle"></div>
  </div>
  <div class="brand">
    <span class="logo" role="img" aria-label="MTEB"></span>
    <span class="brand-name">MTEB</span>
  </div>
</header>

<div class="plot"><svg id="plot"></svg></div>

<table>
  <thead><tr><th></th><th>model</th><th class="num">active params</th><th class="num">score</th><th class="num">leaderboard rank</th></tr></thead>
  <tbody id="rows"></tbody>
</table>

<footer id="footer"></footer>

<script>
// COPY — sentences here; fetch.py supplies only values.
const COPY = {
  eyebrow: "New on the leaderboard",
  title: "The Pareto tag: best score for its size",
  subtitle: "No model with the same or fewer active parameters scores higher",
  yTitle: "Mean (Task)",
  xTitle: "Active parameters",
  footer: "MTEB(Multilingual, v2): models with complete results and a known size. Source: leaderboard.mteb.org",
};

const d = { ...COPY, ...JSON.parse(document.getElementById("card-data").textContent) };
const set = (id, v) => { const n = document.getElementById(id); if (n) n.textContent = v ?? ""; };
["eyebrow", "title", "subtitle", "footer"].forEach(k => set(k, d[k]));
if (d.mode === "dark") document.documentElement.dataset.mode = "dark";

const pts = (d.points || []).map(p => ({ ...p, x: p.active_b * 1e9 }));
const tagged = pts.filter(p => p.pareto).sort((a, b) => a.x - b.x || b.score - a.score);
tagged.forEach((p, i) => p.n = i + 1);

const svg = document.getElementById("plot");
const box = svg.getBoundingClientRect();
const W = Math.round(box.width), H = Math.round(box.height);
svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
const el = (t, a, txt) => {
  const n = document.createElementNS("http://www.w3.org/2000/svg", t);
  for (const k in a) n.setAttribute(k, a[k]);
  if (txt != null) n.textContent = txt;
  svg.appendChild(n); return n;
};

// Static models sit at exactly 0 active parameters — a real value log() cannot take,
// so they get their own band behind an explicit axis break.
const hasZero = pts.some(p => p.x === 0);
const M = { t: 30, r: 24, b: 52, l: 54 };
const ZERO_W = hasZero ? 62 : 0, BREAK_W = hasZero ? 22 : 0;
const nz = pts.filter(p => p.x > 0).map(p => Math.log10(p.x));
const xmin = Math.floor(Math.min(...nz) * 2) / 2 - 0.1;
const xmax = Math.ceil(Math.max(...nz) * 2) / 2 + 0.1;
const ys = pts.map(p => p.score);
const ymin = Math.floor((Math.min(...ys) - 2) / 5) * 5, ymax = Math.ceil((Math.max(...ys) + 2) / 5) * 5;
const LOG_L = M.l + ZERO_W + BREAK_W;
const X = v => v === 0 ? M.l + ZERO_W / 2 : LOG_L + (Math.log10(v) - xmin) / (xmax - xmin) * (W - LOG_L - M.r);
const Y = v => H - M.b - (v - ymin) / (ymax - ymin) * (H - M.t - M.b);

for (let v = ymin; v <= ymax; v += 5) {
  el("line", { class: "grid", x1: M.l, x2: W - M.r, y1: Y(v), y2: Y(v) });
  el("text", { class: "tick", x: M.l - 10, y: Y(v) + 5, "text-anchor": "end" }, v);
}
const fmt = n => n === 0 ? "0" : n >= 1e9 ? +(n / 1e9).toPrecision(3) + "B" : n >= 1e6 ? Math.round(n / 1e6) + "M" : Math.round(n / 1e3) + "K";
for (let e = Math.ceil(xmin); e <= Math.floor(xmax); e++) {
  el("text", { class: "tick", x: X(10 ** e), y: H - M.b + 24, "text-anchor": "middle" }, fmt(10 ** e));
}
if (hasZero) {
  el("text", { class: "tick", x: X(0), y: H - M.b + 24, "text-anchor": "middle" }, "0");
  el("text", { class: "zero-note", x: X(0), y: H - M.b + 41, "text-anchor": "middle" }, "static");
}
el("line", { class: "axis-line", x1: M.l, x2: W - M.r, y1: H - M.b, y2: H - M.b });
if (hasZero) {
  const bx = M.l + ZERO_W + BREAK_W / 2, by = H - M.b;
  el("rect", { x: bx - 9, y: by - 6, width: 18, height: 12, fill: "var(--surface)" });
  for (const dx of [-4, 3]) el("line", { class: "axis-line", x1: bx + dx, y1: by + 7, x2: bx + dx + 6, y2: by - 7 });
}
el("text", { class: "axis-title", x: (LOG_L + W - M.r) / 2, y: H - 4, "text-anchor": "middle" }, d.xTitle);
el("text", { class: "axis-title", x: 0, y: 12, "text-anchor": "start" }, d.yTitle);

pts.filter(p => !p.pareto).forEach(p => el("circle", { class: "peer-dot", cx: X(p.x), cy: Y(p.score), r: 6 }));

if (tagged.length) {
  // staircase: a tagged model's score holds until the next larger tagged model
  let path = `M ${X(tagged[0].x)} ${Y(tagged[0].score)}`;
  for (let j = 1; j < tagged.length; j++)
    path += ` L ${X(tagged[j].x)} ${Y(tagged[j - 1].score)} L ${X(tagged[j].x)} ${Y(tagged[j].score)}`;
  path += ` L ${W - M.r} ${Y(tagged[tagged.length - 1].score)}`;
  el("path", { class: "fline", d: path });
}
tagged.forEach(p => {
  el("circle", { class: "tag-dot", cx: X(p.x), cy: Y(p.score), r: 13 });
  el("text", { class: "tag-num", x: X(p.x), y: Y(p.score) + 5, "text-anchor": "middle" }, p.n);
});

const tbody = document.getElementById("rows");
tagged.forEach(p => {
  const [org, name] = p.model.includes("/") ? p.model.split("/", 2) : ["", p.model];
  const tr = document.createElement("tr");
  tr.innerHTML = `<td class="idx"><span>${p.n}</span></td>
    <td class="model"><span class="org">${org}/</span>${name}</td>
    <td class="num">${fmt(p.x)}</td>
    <td class="num">${p.score.toFixed(2)}</td>
    <td class="num rank">${p.rank}</td>`;
  tbody.appendChild(tr);
});

window.__altText = [
  `${d.eyebrow}: ${d.title}. ${d.subtitle}.`,
  `Scatter plot of Mean (Task) score against active parameters on ${d.benchmark}, for ${pts.length} models with complete results and a known size. ${tagged.length} models carry the Pareto tag and are joined by a staircase line:`,
  tagged.map(p => `${p.n}. ${p.model}, ${fmt(p.x)} active parameters, score ${p.score.toFixed(2)}, leaderboard rank ${p.rank}`).join("; ") + ".",
  `Source: leaderboard.mteb.org.`,
].join(" ");
</script>
