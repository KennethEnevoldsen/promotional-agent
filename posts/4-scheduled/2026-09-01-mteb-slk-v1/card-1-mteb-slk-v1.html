<!--
  Card for the MTEB(slk, v1) post. A benchmark_addition where the news is what the
  board contains, not who leads it — so this is a composition card, not a ranking:
  one stacked column per task type, split into tasks that already existed (grey) and
  tasks mteb#4788 defines itself (blue). Same shape as the MTEB(kor, v2) card, which is
  where the column zone and palette come from; the second zone differs because the
  question differs (kor-v2 asked "does the wider board change who leads", which needs
  two boards to compare — this board has no predecessor).

  Second zone: six of the seventeen new tasks, one per task type, with what each one
  actually is. That is the part a reader cannot get from "31 tasks across 7 task types"
  — Slovak parliamentary sentiment and pharmacist answers to medication questions are
  the reason this board is not a translation of an English one.

  The day-one ranking is deliberately NOT on this card. Only 8 models have all 31 tasks
  while 11 more are one task short (WebFAQRetrieval, see fetch.py), so a leaderboard
  drawn today is a picture of who finished submitting first. The post text states the
  leader with that scope attached, where a sentence can carry it; a card travels as a
  screenshot and cannot.

    uv run posts/3-review/mteb-slk-v1/fetch.py
    uv run mteb-render --card posts/3-review/mteb-slk-v1/card-1-mteb-slk-v1.html \
      --out posts/3-review/mteb-slk-v1/card-1-mteb-slk-v1.png
-->

<script type="text/plain" id="alt-text">
New benchmark on MTEB: MTEB(slk, v1) — 31 tasks across 7 task types — 17 of them built for this board. Stacked column chart, tasks per type, new tasks above existing ones: Classification 7 (3 new), BitextMining 6 (1 new), Clustering 5 (4 new), Retrieval 5 (1 new), Reranking 3 (3 new), PairClassification 3 (3 new), STS 2 (2 new). 8 models have complete 31-task coverage so far. Six of the 17 new tasks: SlovakPharmacyDrMaxReranking (Reranking) — Pharmacists’ answers to medication and health questions, from a Slovak pharmacy site; DemagogSKNLI (PairClassification) — Fact-checkers’ evidence paired with the political claims it supports or refutes; SlovakParlaSentClassification (Classification) — Sentiment in Slovak parliamentary debate, three levels; PravdaSKTagClustering (Clustering) — News articles from Pravda.sk, grouped by their editorial tags; SMESumRetrieval (Retrieval) — Article introductions as queries over 80,000 SME news documents; SlovakSTS (STS) — A professional Slovak translation of the STS Benchmark. Benchmark by andrejridzik. Source: MTEB, leaderboard.mteb.org.
</script>

<script>
// Glosses are editorial: one sentence each, condensed from the task's own
// `TaskMetadata.description` in mteb#4788. The task names and their types are data —
// fetch.py writes them from the live benchmark and fails if one does not exist.
const COPY = {
  eyebrow: "New benchmark on MTEB",
  title: "MTEB(slk, v1)",
  specs: "SkMTEB \u00b7 arXiv:2606.13647 \u00b7 Slovak, a low-resource West Slavic language",
  subtitle: "31 tasks across 7 task types \u2014 17 of them built for this board",
  footer: "Benchmark by andrejridzik",
  leg_new: "new in mteb#4788",
  leg_old: "existing tasks, scoped to Slovak",
  tasks_title: "Six of the seventeen new tasks \u2014 one per task type",
  glosses: {
    "SlovakPharmacyDrMaxReranking": "Pharmacists\u2019 answers to medication and health questions, from a Slovak pharmacy site",
    "DemagogSKNLI": "Fact-checkers\u2019 evidence paired with the political claims it supports or refutes",
    "SlovakParlaSentClassification": "Sentiment in Slovak parliamentary debate, three levels",
    "PravdaSKTagClustering": "News articles from Pravda.sk, grouped by their editorial tags",
    "SMESumRetrieval": "Article introductions as queries over 80,000 SME news documents",
    "SlovakSTS": "A professional Slovak translation of the STS Benchmark",
  },
};

const d = { ...COPY, ...JSON.parse(document.getElementById("card-data").textContent) };
const set = (id, v) => { const n = document.getElementById(id); if (n) n.textContent = v ?? ""; };
set("eyebrow", d.eyebrow); set("title", d.title); set("specs", d.specs);
set("subtitle", d.subtitle); set("footer", d.footer);
set("leg-new", d.leg_new); set("leg-old", d.leg_old); set("tasks-title", d.tasks_title);
if (d.mode === "dark") document.documentElement.dataset.mode = "dark";

const byType = d.by_type;
const MAX = Math.max(...byType.map(t => t.new + t.existing));
// Pixel heights from a fixed maximum, not percentages of a box whose height moves with
// the content above it — bars stay comparable between renders.
const CHART_PX = 300;
const px = n => Math.round((n / MAX) * CHART_PX);

document.getElementById("cols").innerHTML = byType.map(t => {
  const total = t.new + t.existing;
  return `
    <div class="col-group">
      <span class="col-total">${total}</span>
      <div class="stack" style="height:${CHART_PX}px">
        ${t.new ? `<div class="seg new" style="height:${px(t.new)}px">${t.new}</div>` : ""}
        ${t.existing ? `<div class="seg old${t.new ? "" : " alone"}" style="height:${px(t.existing)}px">${t.existing}</div>` : ""}
      </div>
      <div class="baseline"></div>
      <div class="col-label">${t.type}</div>
    </div>`;
}).join("");

document.getElementById("task-rows").innerHTML = d.highlights.map(h => `
    <div class="task-row">
      <span class="task-name">${h.task}<span class="task-type">${h.type}</span></span>
      <span class="task-gloss">${d.glosses[h.task] ?? ""}</span>
    </div>`
).join("");

window.__altText = [
  `${d.eyebrow}: ${d.title} \u2014 ${d.subtitle}.`,
  `Stacked column chart, tasks per type, new tasks above existing ones: ` +
    byType.map(t => `${t.type} ${t.new + t.existing} (${t.new} new)`).join(", ") + ".",
  `${d.n_models_complete} models have complete ${d.n_tasks}-task coverage so far.`,
  `Six of the ${d.n_new} new tasks: ` +
    d.highlights.map(h => `${h.task} (${h.type}) \u2014 ${d.glosses[h.task] ?? ""}`).join("; ") + ".",
  `${d.footer}. Source: MTEB, leaderboard.mteb.org.`,
].join(" ");
</script>
