<!doctype html>
<meta charset="utf-8">
<title>Audio length, before and after</title>
<!--
  Card for part 1 of the audio-video-input-config thread. It shows the change, not just
  the old cut: one real long recording (BirdCLEF's longest evaluation clip, 491.3 s, from
  data.json) is the axis, and each row shows how much of it a model family processes
  before mteb 2.24.4 and from 2.24.4. Whisper is included on purpose: "now" means the
  model's own limit, which is not always longer.

  Every before/after value is read from the wrapper code, parent 8f266949 vs merge
  5621901c (mteb#5454). Rows were kept only where both ends could be confirmed there:
    wav2vec2  parent wav2vec2_models.py:85 (default 30.0), :140 (max_length=30 s)
              merge  wav2vec2_models.py:91 (default None) -> :150 seconds_to_samples ->
                     modality_collators.py:142-147 (None = no truncation); no override
                     in any ModelMeta
    HuBERT    parent hubert_models.py:25, :69 ; merge hubert_models.py:31 (None), :65
    OmniVinci parent omnivinci_models.py:42 (30.0), :56-58, :219-223 -> VideoCollator ->
              modality_collators.py:111-114 (truncates audio) ; merge omnivinci_models.py:44-46
              (120.0, "audio_chunk_length=120" in nvidia/omnivinci config.json), :60, :220-223
    Whisper   parent whisper_models.py:25, :70 ; merge whisper_models.py:25-27 (30.0,
              "chunk_length=30"), :72-73
  Dropped: WavLM (its new 240 s is an mteb memory cap, not a limit its authors set, so it
  contradicts the post); Qwen2.5-Omni based models (parent passed max_length=None to the processor, so
  the effective cut depends on transformers' defaults, not on mteb code) and e5-omni
  (~20 s via a text-token limit, not a length setting).

  Colour encodes one thing: before (grey) vs from 2.24.4 (blue).

    uv run mteb-render --card posts/3-review/audio-video-input-config/card-1-before-after.html \
      --out posts/3-review/audio-video-input-config/card-1-before-after.png
-->

    {"family": "HuBERT", "before_s": 30, "now_s": null},

<script type="text/plain" id="alt-text">
Changed in mteb 2.24.4: Audio models now use their own length limit. One 8-minute BirdCLEF recording (491.3 s): how much of it each model is scored on. Bar chart with two bars per model family, before mteb 2.24.4 (grey) and from mteb 2.24.4 (blue), on an axis from 0 to 491.3 seconds. wav2vec2 (its config sets no length limit): before, the first 30 s; now, the whole clip (491.3 s). HuBERT (its config sets no length limit): before, the first 30 s; now, the whole clip (491.3 s). OmniVinci (its config sets 120 s): before, the first 30 s; now, the first 120 s. Whisper (its config sets 30 s): before, the first 30 s; now, the first 30 s. Clip length from mteb's task statistics. Limits from each model's published config, as applied in mteb before and from 2.24.4.
</script>

  [data-mode="dark"] {
    --surface:        #1a1a19;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --accent:         #5b8fff;

    --hairline:       rgba(255, 255, 255, 0.10);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 1200px; overflow: hidden;
    background: var(--surface); color: var(--text-primary);
    font-family: var(--font-sans);
    display: flex; flex-direction: column;
    padding: 44px 56px 32px;
  }

  header { display: flex; justify-content: space-between; align-items: flex-start; }
  .eyebrow { font-size: 18px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--accent); }
  h1 { font-size: 42px; font-weight: 640; letter-spacing: -0.02em; margin-top: 10px; line-height: 1.12; max-width: 900px; }
  .subtitle { font-size: 22px; color: var(--text-secondary); margin-top: 10px; }
  .brand { display: flex; align-items: center; gap: 12px; padding-top: 4px; }
  .brand-name { font-size: 30px; font-weight: 700; letter-spacing: 0.01em; }
  .logo { width: 39px; height: 41px; flex: none; background: var(--logo-uri) left center / contain no-repeat; }

  .legend { display: flex; gap: 32px; margin-top: 28px; font-size: 19px; color: var(--text-secondary); }
  .legend span { display: inline-flex; align-items: center; gap: 10px; }
  .sw { width: 26px; height: 16px; border-radius: 3px; display: inline-block; }
  .sw.before { background: var(--peer); }
  .sw.now { background: var(--accent); }

  /* label | track | value. The track column is the clip, 0 to its full length. */
  .grid { display: grid; grid-template-columns: 250px 1fr 150px; column-gap: 22px; }
  .plot { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 64px; }
  .row { align-items: center; }
  .label .fam { font-size: 28px; font-weight: 640; }
  .label .note { font-size: 17px; color: var(--text-muted); margin-top: 4px; line-height: 1.3; }
  .bars { display: flex; flex-direction: column; gap: 10px; position: relative; }
  .track { height: 40px; position: relative; background: var(--gridline); border-radius: 0 4px 4px 0; }
  .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0 4px 4px 0; }
  .fill.before { background: var(--peer); }
  .fill.now { background: var(--accent); }
  .vals { display: flex; flex-direction: column; gap: 10px; }
  .vals span { height: 40px; line-height: 40px; font-size: 21px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .vals .before { color: var(--text-muted); }
  .vals .now { color: var(--text-primary); font-weight: 640; }

  .axis { margin-top: -20px; }
  .ticks { position: relative; height: 22px; border-top: 1px solid var(--axis); }
  .ticks span { position: absolute; top: 8px; transform: translateX(-50%); font-size: 17px; color: var(--text-muted); white-space: nowrap; }
  .ticks span:first-child { transform: none; }
  .axis-name { grid-column: 2; text-align: center; font-size: 18px; color: var(--text-secondary); margin-top: 18px; }

  footer { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--hairline); }
  .source { font-size: 15px; color: var(--text-muted); line-height: 1.45; }
</style>

<header>
  <div>
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="title"></h1>
    <div class="subtitle" id="subtitle"></div>
  </div>
  <div class="brand">
    <span class="logo" role="img" aria-label="MTEB"></span>
    <span class="brand-name">MTEB</span>
  </div>
</header>

<div class="legend">
  <span><i class="sw before"></i><span id="legend-before"></span></span>
  <span><i class="sw now"></i><span id="legend-now"></span></span>
</div>

<div class="plot" id="plot"></div>

<footer><div class="source" id="source"></div></footer>

<script>
const COPY = {
  eyebrow: "Changed in mteb 2.24.4",
  title: "Audio models now use their own length limit",
  subtitle: "One 8-minute BirdCLEF recording (491.3 s): how much of it each model is scored on",
  legend_before: "before mteb 2.24.4",
  legend_now: "from mteb 2.24.4",
  notes: {
    "wav2vec2": "its config sets no length limit",
    "HuBERT": "its config sets no length limit",
    "OmniVinci": "its config sets 120 s",
    "Whisper": "its config sets 30 s",
  },
  axis_name: "seconds of the recording",
  source: "Clip length from mteb's task statistics. Limits from each model's published config, as applied in mteb before and from 2.24.4.",
};

const d = { ...COPY, ...JSON.parse(document.getElementById("card-data").textContent) };
const set = (id, v) => { const n = document.getElementById(id); if (n) n.textContent = v ?? ""; };
["eyebrow","title","subtitle","source"].forEach(k => set(k, d[k]));
set("legend-before", d.legend_before); set("legend-now", d.legend_now);
if (d.mode === "dark") document.documentElement.dataset.mode = "dark";

const L = d.clip.seconds;
// null = no cap: the model gets the whole clip.
const used = s => s == null ? L : Math.min(s, L);
const pct = s => (used(s) / L * 100).toFixed(2);
const fmt = s => s == null || s >= L ? "whole clip" : `${s} s`;

const rows = d.rows.map(r => `
  <div class="grid row">
    <div class="label"><div class="fam">${r.family}</div><div class="note">${d.notes[r.family] ?? ""}</div></div>
    <div class="bars">
      <div class="track"><div class="fill before" style="width:${pct(r.before_s)}%"></div></div>
      <div class="track"><div class="fill now" style="width:${pct(r.now_s)}%"></div></div>
    </div>
    <div class="vals"><span class="before">${fmt(r.before_s)}</span><span class="now">${fmt(r.now_s)}</span></div>
  </div>`).join("");

const ticks = [0, 60, 120, 180, 240, 300, 360, 420, 480];
const axis = `
  <div class="grid axis">
    <div></div>
    <div class="ticks">${ticks.map(v => `<span style="left:${(v / L * 100).toFixed(2)}%">${v}</span>`).join("")}</div>
    <div></div>
    <div class="axis-name">${d.axis_name}</div>
  </div>`;
document.getElementById("plot").innerHTML = rows + axis;

const say = s => s == null || s >= L ? `the whole clip (${L} s)` : `the first ${s} s`;
window.__altText = [
  `${d.eyebrow}: ${d.title}. ${d.subtitle}.`,
  `Bar chart with two bars per model family, ${d.legend_before} (grey) and ${d.legend_now} (blue), on an axis from 0 to ${L} seconds.`,
  d.rows.map(r => `${r.family} (${d.notes[r.family]}): before, ${say(r.before_s)}; now, ${say(r.now_s)}`).join(". ") + ".",
  d.source,
].join(" ");
</script>
