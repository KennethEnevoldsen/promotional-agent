<!--
  Card for the Bekko post. Each post owns its card markup, so the image, the data behind
  it and the markup that drew it sit together. There is no shared template to inherit
  from and none to keep in sync — copy this file for the next card and change it freely.
  Extracting the common parts is worth doing once several posts exist and the repetition
  is real rather than anticipated.

  Plots the subjects against every size peer with results on the same benchmark. A bare
  score is unreadable: "56.73" means nothing without knowing what a model of that size
  normally gets, so the peer set IS the interpretation.

  Form is emphasis (one hue + gray), not categorical: peers are context, not series
  competing for identity, so they are deliberately not color-coded.

  Models carry their full Hugging Face name, split across two lines at the "/".
  Abbreviating saves room but makes a claim harder to check against the leaderboard,
  and two models can abbreviate to the same string.

  This file is self-contained: fetch.py writes the numbers into #card-data below, and
  the copy lives in the COPY object further down. Open it in a browser and you see
  exactly what renders — there is no separate data file to fall out of sync with.

    .venv/bin/python posts/2026-08-09-bekko-task-profile/fetch.py        # refresh the numbers
    uv run visuals/render.py --card posts/2026-08-09-bekko-task-profile/card.html \
      --out posts/2026-08-09-bekko-task-profile/card.png                 # ~3s
    uv run visuals/render.py --card posts/2026-08-09-bekko-task-profile/card.html --mode dark \
      --out posts/2026-08-09-bekko-task-profile/card.png

  Edit copy freely — it costs a re-render, not a re-fetch. Only re-run fetch.py when
  the cohort query itself changes, or before posting to confirm the numbers still hold.

  PALETTE IS A PLACEHOLDER — swap the :root block only.
-->

    --axis:           #383835;
    --hairline:       rgba(255, 255, 255, 0.10);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 1200px; overflow: hidden;
    background: var(--surface); color: var(--text-primary);
    font-family: var(--font-sans);
    display: flex; flex-direction: column;
    padding: 44px 56px 32px;
  }

  header { display: flex; justify-content: space-between; align-items: flex-start; }
  .eyebrow {
    font-size: 18px; font-weight: 600; letter-spacing: 0.05em;
    text-transform: uppercase; color: var(--accent);
  }
  h1 { font-size: 46px; font-weight: 640; letter-spacing: -0.02em; margin-top: 10px; }
  .subtitle { font-size: 22px; color: var(--text-secondary); margin-top: 4px; }
  .specs { font-size: 15px; color: var(--text-muted); margin-top: 6px; }

  .brand { display: flex; align-items: center; gap: 12px; padding-top: 4px; }
  .brand-name {
    font-size: 30px; font-weight: 700; letter-spacing: 0.01em;
    color: var(--text-primary);
  }

  .plot { flex: 1; margin-top: 6px; }
  svg { width: 100%; height: 100%; display: block; overflow: visible; }

  /* Radar. Three series, so this is the one card that uses categorical colour —
     the models ARE the subject here, unlike the scatter where peers are context. */
  .web { stroke: var(--gridline); fill: none; stroke-width: 1; }
  .spoke { stroke: var(--gridline); stroke-width: 1; }
  .ring-label { fill: var(--text-muted); font-size: 12px; }
  .axis-name { fill: var(--text-secondary); font-size: 15px; font-weight: 550; }
  .axis-count { fill: var(--text-muted); font-size: 12.5px; }
  .series-line { fill: none; stroke-width: 2.5; stroke-linejoin: round; }
  .series-dot { r: 4; }

  .rlegend {
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: 8px 22px; margin-top: 2px;
  }
  .rlegend div { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .rlegend .sw { width: 20px; height: 3px; border-radius: 2px; flex: none; }
  .rlegend .nm { color: var(--text-secondary); }
  .rlegend .size { color: var(--text-muted); font-size: 12.5px; }
  .grid { stroke: var(--gridline); stroke-width: 1; }
  .axis-line { stroke: var(--axis); stroke-width: 1; }
  .tick { fill: var(--text-muted); font-size: 15px; }
  .axis-title { fill: var(--text-secondary); font-size: 16px; font-weight: 550; }
  /* No surface ring on either dot: it was there to separate overlapping marks, but the
     points are well spread and over the shaded region the ring reads as a white halo. */
  .peer-dot { fill: var(--peer); }
  .subject-dot { fill: var(--accent); }
  .subject-label { fill: var(--text-primary); font-size: 18px; font-weight: 640; }
  .subject-org { fill: var(--text-secondary); font-size: 12px; }
  .subject-score { fill: var(--text-secondary); font-size: 17px; }
  .peer-label { fill: var(--text-muted); font-size: 14px; }
  .peer-org { fill: var(--text-muted); font-size: 10.5px; opacity: 0.8; }
  /* The frontier is drawn as a region, not a line: its top edge IS the boundary, so a
     separate stroke along it only restates what the shading already says. Slightly
     stronger than a pure background tint because it is now the sole marker. */
  .frontier-fill { fill: var(--accent); opacity: 0.09; stroke: none; }
  .zero-note { fill: var(--text-muted); font-size: 13px; font-style: italic; }

  footer {
    display: flex; justify-content: space-between; align-items: flex-end;
    margin-top: 12px; padding-top: 14px; border-top: 1px solid var(--hairline);
    font-size: 17px; color: var(--text-muted);
  }
  .foot-left { display: flex; flex-direction: column; gap: 5px; }
  footer .context { color: var(--text-secondary); font-weight: 550; }
  .source { font-size: 14px; color: var(--text-muted); }

  /* The dots icon is multi-colour with transparency, so it is drawn as an image rather
     than a mask — masking would flatten its blues to a single ink and lose the mark.
     Its own blues read on both surfaces, so no per-mode variant is needed. Embedded as
     a data URI because render.py renders from a temp directory, where a relative path
     would not resolve. */
  .logo {
    width: 39px; height: 41px; flex: none;   /* asset aspect 0.958 */
    background: var(--logo-uri) left center / contain no-repeat;
  }
</style>

<header>
  <div>
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="title"></h1>
    <div class="subtitle" id="subtitle"></div>
    <div class="specs" id="specs"></div>
  </div>
  <!-- Brand block, top right on every post. Replaces the legend: the subtitle already
       names the Pareto frontier, each dot carries its own model name, and the subjects
       are the only ones in accent with a score beside them — so the legend was
       restating what the card says elsewhere. -->
  <div class="brand">
    <span class="logo" role="img" aria-label="MTEB"></span>
    <span class="brand-name">MTEB</span>
  </div>
</header>

<div class="plot"><svg id="plot"></svg></div>
<!-- Legend under the figure: above it, the header stack pushed the radar down until the
     bottom axis label collided with the footer rule. -->
<div class="rlegend" id="rlegend"></div>

<footer>
  <!-- The cohort statement is no longer printed on the card. It still reaches the alt
       text, which describes the plot as covering N multilingual models under the size
       cap, so the scope survives for anyone reading the description. -->
  <div class="foot-left">
    <span class="source">Source · MTEB (leaderboard.mteb.org)</span>
  </div>
  <span id="footer"></span>
</footer>

<script>
// ---------------------------------------------------------------------------
// COPY — see card.html for why this is here and not in fetch.py.
// ---------------------------------------------------------------------------
const COPY = {
  eyebrow: "New model on MTEB",
  title: "Bekko",
  specs: "110 languages · 8k context · Matryoshka 64–384",
  footer: "Contributed by hotchpotch",
};

const d = { ...COPY, ...JSON.parse(document.getElementById("card-data").textContent) };
const set = (id, v) => { const n = document.getElementById(id); if (n) n.textContent = v ?? ""; };
// The subtitle is built from the data, because the whole point of this card is the
// pair it compares — a hand-written line would drift the moment either score moves.
const SUB = d.series.find(s => s.role === "subject");
const HI = d.series.find(s => s.role === "highlight");
d.subtitle = `Matches ${HI.model.split("/").pop()} within ${d.score_gap} at ${d.shrink_factor}\u00d7 fewer active parameters`;
set("eyebrow", d.eyebrow); set("title", d.title); set("subtitle", d.subtitle);
set("specs", d.specs); set("footer", d.footer);
if (d.mode === "dark") document.documentElement.dataset.mode = "dark";

const ROLE_COLOR = {
  subject: "var(--subject)", highlight: "var(--highlight)", reference: "var(--context)",
};
const colorOf = s => ROLE_COLOR[s.role];
const M = n => n >= 1e9 ? `${(n / 1e9).toFixed(1)}B` : `${(n / 1e6).toFixed(0)}M`;

// Size, not mean score: the mean is what the other two cards are for, and printing it
// here invites reading the radar as a ranking instead of a shape comparison.
document.getElementById("rlegend").innerHTML = d.series.map(s => `
  <div>
    <span class="sw" style="background:${colorOf(s)}"></span>
    <span class="nm">${s.model}</span>
    <span class="size">${M(s.active)} active</span>
  </div>`).join("");

const svg = document.getElementById("plot");
const box = svg.getBoundingClientRect();
const W = Math.round(box.width), H = Math.round(box.height);
svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
const el = (t, a, txt) => {
  const n = document.createElementNS("http://www.w3.org/2000/svg", t);
  for (const k in a) n.setAttribute(k, a[k]);
  if (txt != null) n.textContent = txt;
  svg.appendChild(n); return n;
};

// Radial scale starts at zero — a radar with a truncated centre exaggerates every
// difference, and area is already an over-readable channel.
const RMAX = 80, RINGS = [20, 40, 60, 80];
const cx = W / 2, cy = H / 2 + 4;
const R = Math.min(H / 2 - 20, W / 2 - 185);   // leave room for the axis labels
const axes = d.axes;
const ang = i => (i / axes.length) * 2 * Math.PI - Math.PI / 2;
const P = (i, v) => [cx + Math.cos(ang(i)) * R * (v / RMAX),
                     cy + Math.sin(ang(i)) * R * (v / RMAX)];

// web: one polygon per ring, plus a spoke per axis
for (const ring of RINGS) {
  el("polygon", {
    class: "web",
    points: axes.map((_, i) => P(i, ring).join(",")).join(" "),
  });
}
axes.forEach((_, i) => {
  const [x, y] = P(i, RMAX);
  el("line", { class: "spoke", x1: cx, y1: cy, x2: x, y2: y });
});
// Ring labels stop short of the outer ring: the top axis label already sits there and
// the two collide.
for (const ring of RINGS.slice(0, -1)) {
  el("text", { class: "ring-label", x: cx + 6, y: cy - R * (ring / RMAX) - 4 }, ring);
}

// axis labels, anchored by which side of the circle they sit on
axes.forEach((a, i) => {
  const [x, y] = P(i, RMAX);
  const dx = x - cx, dy = y - cy;
  const anchor = Math.abs(dx) < 6 ? "middle" : dx > 0 ? "start" : "end";
  const lx = x + (anchor === "middle" ? 0 : dx > 0 ? 12 : -12);
  const ly = y + (Math.abs(dx) < 6 ? (dy > 0 ? 20 : -10) : 4);
  el("text", { class: "axis-name", x: lx, y: ly, "text-anchor": anchor }, a.name);
  el("text", { class: "axis-count", x: lx, y: ly + 16, "text-anchor": anchor },
     `${a.n_tasks} tasks`);
});

// Lines only, no fills. Three translucent fills stack into a muddy wash that belongs to
// no series, and area over-reads next to position anyway. The MTEB leaderboard's own
// radar does the same.
const ORDER = { reference: 0, highlight: 1, subject: 2 };
[...d.series].sort((a, b) => ORDER[a.role] - ORDER[b.role]).forEach(s => {
  const pts = s.values.map((v, j) => P(j, Math.max(0, v)).join(",")).join(" ");
  const isCtx = s.role === "reference";
  el("polygon", {
    class: "series-line", points: pts, stroke: colorOf(s),
    "stroke-width": isCtx ? 1.75 : 2.75, opacity: isCtx ? 0.75 : 1,
  });
  if (!isCtx) s.values.forEach((v, j) => {
    const [x, y] = P(j, Math.max(0, v));
    el("circle", { class: "series-dot", cx: x, cy: y, fill: colorOf(s) });
  });
});

window.__altText = [
  `${d.eyebrow}: ${d.title} — ${d.subtitle}.`,
  `Radar chart over ${axes.length} task types on ${d.benchmark}: ` +
    axes.map(a => `${a.name} (${a.n_tasks} tasks)`).join(", ") + ".",
  d.series.map(s =>
    `${s.model} (${M(s.active)} active, mean ${s.mean.toFixed(2)}): ` +
    axes.map((a, j) => `${a.name} ${s.values[j].toFixed(1)}`).join(", ")).join(". ") + ".",
  `${d.excluded_axes.join(", ")} excluded: its centered metric can be negative and has no position on a zero-based radial axis.`,
  `${d.footer}. Source: MTEB, leaderboard.mteb.org.`,
].join(" ");
</script>
