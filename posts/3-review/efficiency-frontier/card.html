<!--
  Card for the Bekko post. Each post owns its card markup, so the image, the data behind
  it and the markup that drew it sit together. There is no shared template to inherit
  from and none to keep in sync — copy this file for the next card and change it freely.
  Extracting the common parts is worth doing once several posts exist and the repetition
  is real rather than anticipated.

  Plots the subjects against every size peer with results on the same benchmark. A bare
  score is unreadable: "56.73" means nothing without knowing what a model of that size
  normally gets, so the peer set IS the interpretation.

  Form is emphasis (one hue + gray), not categorical: peers are context, not series
  competing for identity, so they are deliberately not color-coded.

  Models carry their full Hugging Face name, split across two lines at the "/".
  Abbreviating saves room but makes a claim harder to check against the leaderboard,
  and two models can abbreviate to the same string.

  This file is self-contained: fetch.py writes the numbers into #card-data below, and
  the copy lives in the COPY object further down. Open it in a browser and you see
  exactly what renders — there is no separate data file to fall out of sync with.

    .venv/bin/python posts/2026-08-17-efficiency-frontier/fetch.py        # refresh the numbers
    uv run visuals/render.py --card posts/2026-08-17-efficiency-frontier/card.html \
      --out posts/2026-08-17-efficiency-frontier/card.png                 # ~3s

  Edit copy freely — it costs a re-render, not a re-fetch. Only re-run fetch.py when
  the cohort query itself changes, or before posting to confirm the numbers still hold.

  PALETTE IS A PLACEHOLDER — swap the :root block only.
-->

    /* --- swap these for MTEB brand values --- */
    --surface:        #fcfcfb;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --accent:         #3d7bff;
    --peer:           #b9b7b0;
    --now:            #3d7bff;   /* MTEB brand blue — the cohort that carries the point */
    --mid:            #a06bff;   /* MTEB brand purple, the front-page gradient's partner */
    --old:            #b9b7b0;   /* context grey: the oldest frontier is background */
    --gridline:       #e1e0d9;
    --axis:           #c3c2b7;
    --hairline:       rgba(11, 11, 11, 0.10);
    --font-sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  [data-mode="dark"] {
    --surface:        #1a1a19;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --accent:         #5b8fff;
    --peer:           #55534e;
    --now:            #5b8fff;
    --mid:            #b98cff;
    --old:            #6f6d67;
    --gridline:       #2c2c2a;
    --axis:           #383835;
    --hairline:       rgba(255, 255, 255, 0.10);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 1200px; overflow: hidden;
    background: var(--surface); color: var(--text-primary);
    font-family: var(--font-sans);
    display: flex; flex-direction: column;
    padding: 44px 56px 32px;
  }

  header { display: flex; justify-content: space-between; align-items: flex-start; }
  .eyebrow {
    font-size: 18px; font-weight: 600; letter-spacing: 0.05em;
    text-transform: uppercase; color: var(--accent);
  }
  h1 { font-size: 46px; font-weight: 640; letter-spacing: -0.02em; margin-top: 10px; }
  .subtitle { font-size: 22px; color: var(--text-secondary); margin-top: 4px; }
  .specs { font-size: 15px; color: var(--text-muted); margin-top: 6px; }

  .brand { display: flex; align-items: center; gap: 12px; padding-top: 4px; }
  .brand-name {
    font-size: 30px; font-weight: 700; letter-spacing: 0.01em;
    color: var(--text-primary);
  }

  .plot { flex: 1; margin-top: 10px; }
  svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .grid { stroke: var(--gridline); stroke-width: 1; }
  .axis-line { stroke: var(--axis); stroke-width: 1; }
  .tick { fill: var(--text-muted); font-size: 15px; }
  .axis-title { fill: var(--text-secondary); font-size: 16px; font-weight: 550; }
  /* No surface ring on either dot: it was there to separate overlapping marks, but the
     points are well spread and over the shaded region the ring reads as a white halo. */
  .peer-dot { fill: var(--peer); }
  .subject-dot { fill: var(--accent); }
  .subject-label { fill: var(--text-primary); font-size: 18px; font-weight: 640; }
  .subject-org { fill: var(--text-secondary); font-size: 12px; }
  .subject-score { fill: var(--text-secondary); font-size: 17px; }
  .peer-label { fill: var(--text-muted); font-size: 14px; }
  .peer-org { fill: var(--text-muted); font-size: 10.5px; opacity: 0.8; }
  /* The frontier is drawn as a region, not a line: its top edge IS the boundary, so a
     separate stroke along it only restates what the shading already says. Slightly
     stronger than a pure background tint because it is now the sole marker. */
  .frontier-fill { fill: var(--accent); opacity: 0.09; stroke: none; }
  .zero-note { fill: var(--text-muted); font-size: 13px; font-style: italic; }
  .fline { fill: none; stroke-width: 2.5; stroke-linejoin: round; }
  .fdot { r: 4; }
  .flabel { font-size: 15px; font-weight: 620; }
  .callout { stroke: var(--text-muted); stroke-width: 1; stroke-dasharray: 5 4; fill: none; }
  .callout-text { fill: var(--text-primary); font-size: 15px; font-weight: 620; }
  .callout-sub { fill: var(--text-secondary); font-size: 13px; }

  footer {
    display: flex; justify-content: space-between; align-items: flex-end;
    margin-top: 12px; padding-top: 14px; border-top: 1px solid var(--hairline);
    font-size: 17px; color: var(--text-muted);
  }
  .foot-left { display: flex; flex-direction: column; gap: 5px; }
  footer .context { color: var(--text-secondary); font-weight: 550; }
  .source { font-size: 14px; color: var(--text-muted); }

  /* The dots icon is multi-colour with transparency, so it is drawn as an image rather
     than a mask — masking would flatten its blues to a single ink and lose the mark.
     Its own blues read on both surfaces, so no per-mode variant is needed. Embedded as
     a data URI because render.py renders from a temp directory, where a relative path
     would not resolve. */
  .logo {
    width: 39px; height: 41px; flex: none;   /* asset aspect 0.958 */
    background: var(--logo-uri) left center / contain no-repeat;
  }
</style>

<header>
  <div>
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="title"></h1>
    <div class="subtitle" id="subtitle"></div>
    <div class="specs" id="specs"></div>
  </div>
  <!-- Brand block, top right on every post. Replaces the legend: the subtitle already
       names the Pareto frontier, each dot carries its own model name, and the subjects
       are the only ones in accent with a score beside them — so the legend was
       restating what the card says elsewhere. -->
  <div class="brand">
    <span class="logo" role="img" aria-label="MTEB"></span>
    <span class="brand-name">MTEB</span>
  </div>
</header>

<div class="plot"><svg id="plot"></svg></div>

<footer>
  <!-- The cohort statement is no longer printed on the card. It still reaches the alt
       text, which describes the plot as covering N multilingual models under the size
       cap, so the scope survives for anyone reading the description. -->
  <div class="foot-left">
    <span class="source">Source · MTEB (leaderboard.mteb.org)</span>
  </div>
  <span id="footer"></span>
</footer>

<script>
// ---------------------------------------------------------------------------
// COPY — sentences here; fetch.py supplies only values.
// ---------------------------------------------------------------------------
const COPY = {
  eyebrow: "The state of the field",
  title: "Frontier quality keeps getting cheaper",
  subtitle: "Best score achievable at a given size, on English",
  footer: "",
};

const d = { ...COPY, ...JSON.parse(document.getElementById("card-data").textContent) };
const set = (id, v) => { const n = document.getElementById(id); if (n) n.textContent = v ?? ""; };
set("eyebrow", d.eyebrow); set("title", d.title); set("subtitle", d.subtitle);
set("footer", d.footer);
if (d.mode === "dark") document.documentElement.dataset.mode = "dark";

const H1 = d.headline;
set("specs", `The best score of 2023 now costs ${H1.shrink_factor}\u00d7 fewer active parameters`);

const COLORS = ["var(--old)", "var(--mid)", "var(--now)"];  // oldest → newest
const svg = document.getElementById("plot");
const box = svg.getBoundingClientRect();
const W = Math.round(box.width), H = Math.round(box.height);
svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
const el = (t, a, txt) => {
  const n = document.createElementNS("http://www.w3.org/2000/svg", t);
  for (const k in a) n.setAttribute(k, a[k]);
  if (txt != null) n.textContent = txt;
  svg.appendChild(n); return n;
};

const pts = d.cohorts.flatMap(c => c.points);
// Static models sit at exactly 0 active parameters — a real value that log() cannot
// take, so they get their own band behind an explicit axis break.
const hasZero = pts.some(p => p.x === 0);
const M = { t: 26, r: 24, b: 54, l: 54 };
const ZERO_W = hasZero ? 62 : 0, BREAK_W = hasZero ? 22 : 0;
const nz = pts.filter(p => p.x > 0).map(p => Math.log10(p.x));
const xmin = Math.floor(Math.min(...nz) * 2) / 2 - 0.1;
const xmax = Math.ceil(Math.max(...nz) * 2) / 2 + 0.1;
const ys = pts.map(p => p.y);
const ymin = Math.floor((Math.min(...ys) - 2) / 5) * 5, ymax = Math.ceil((Math.max(...ys) + 2) / 5) * 5;

const LOG_L = M.l + ZERO_W + BREAK_W;
const X = v => v === 0 ? M.l + ZERO_W / 2
  : LOG_L + (Math.log10(v) - xmin) / (xmax - xmin) * (W - LOG_L - M.r);
const Y = v => H - M.b - (v - ymin) / (ymax - ymin) * (H - M.t - M.b);

for (let v = ymin; v <= ymax; v += 5) {
  el("line", { class: "grid", x1: M.l, x2: W - M.r, y1: Y(v), y2: Y(v) });
  el("text", { class: "tick", x: M.l - 10, y: Y(v) + 5, "text-anchor": "end" }, v);
}
const fmt = n => n === 0 ? "0" : n >= 1e9 ? (n / 1e9) + "B" : n >= 1e6 ? Math.round(n / 1e6) + "M" : Math.round(n / 1e3) + "K";
for (let e = Math.ceil(xmin); e <= Math.floor(xmax); e++) {
  const v = Math.pow(10, e);
  el("text", { class: "tick", x: X(v), y: H - M.b + 24, "text-anchor": "middle" }, fmt(v));
}
if (hasZero) {
  el("text", { class: "tick", x: X(0), y: H - M.b + 24, "text-anchor": "middle" }, "0");
  el("text", { class: "zero-note", x: X(0), y: H - M.b + 41, "text-anchor": "middle" }, "static");
}
el("line", { class: "axis-line", x1: M.l, x2: W - M.r, y1: H - M.b, y2: H - M.b });
if (hasZero) {
  const bx = M.l + ZERO_W + BREAK_W / 2, by = H - M.b;
  el("rect", { x: bx - 9, y: by - 6, width: 18, height: 12, fill: "var(--surface)" });
  for (const dx of [-4, 3]) el("line", { class: "axis-line", x1: bx + dx, y1: by + 7, x2: bx + dx + 6, y2: by - 7 });
}
el("text", { class: "axis-title", x: (LOG_L + W - M.r) / 2, y: H - 6, "text-anchor": "middle" }, "Active parameters");
el("text", { class: "axis-title", x: 0, y: 12, "text-anchor": "start" }, "MTEB(eng, v2)");

// the callout: 2023's best score, and where that score is available now
el("line", { class: "callout", x1: X(H1.cheapest_match_today.x), x2: X(H1.best_2023.x),
             y1: Y(H1.best_2023.y), y2: Y(H1.best_2023.y) });

d.cohorts.forEach((c, i) => {
  // staircase: hold the score until a bigger model beats it, then step up
  const f = c.points;
  if (!f.length) return;
  let path = `M ${X(f[0].x)} ${Y(f[0].y)}`;
  for (let j = 1; j < f.length; j++) {
    path += ` L ${X(f[j].x)} ${Y(f[j - 1].y)} L ${X(f[j].x)} ${Y(f[j].y)}`;
  }
  el("path", { d: path, class: "fline", stroke: COLORS[i] });
  f.forEach(p => el("circle", { class: "fdot", cx: X(p.x), cy: Y(p.y), fill: COLORS[i] }));
  const last = f[f.length - 1];
  el("text", { class: "flabel", x: X(last.x) + 10, y: Y(last.y) + 5, fill: COLORS[i] }, c.label);
});

// Callout lives left of the cheap model, in the one genuinely empty region of the plot:
// below 10M active parameters every frontier is under 55, so anything above that line
// and left of the 10M step is clear. Earlier placements ran through the "today"
// staircase, which is the line the callout exists to point at.
const cm = H1.cheapest_match_today;
el("text", { class: "callout-text", x: X(cm.x) - 14, y: Y(64.2), "text-anchor": "end" },
   `${H1.shrink_factor}\u00d7 smaller`);
el("text", { class: "callout-sub", x: X(cm.x) - 14, y: Y(61.2), "text-anchor": "end" },
   `${fmt(cm.x)} now beats 2023's best (${fmt(H1.best_2023.x)})`);

window.__altText = [
  `${d.eyebrow}: ${d.title}. ${d.subtitle}.`,
  `Three Pareto frontiers of score against active parameters on ${d.benchmark}, for models released by end-2023, by end-2024, and today, across ${d.n_models} models with complete results.`,
  `The best score available by end-2023 was ${H1.best_2023.y} from ${H1.best_2023.model} at ${fmt(H1.best_2023.x)} active parameters. Today ${H1.cheapest_match_today.model} matches it at ${fmt(H1.cheapest_match_today.x)} — ${H1.shrink_factor} times fewer.`,
  `Static embedding models appear at zero active parameters, behind an axis break.`,
  "Source: MTEB, leaderboard.mteb.org.",
].join(" ");
</script>
