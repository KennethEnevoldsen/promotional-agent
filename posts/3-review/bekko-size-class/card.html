<!--
  Card for the Bekko post. Each post owns its card markup, so the image, the data behind
  it and the markup that drew it sit together. There is no shared template to inherit
  from and none to keep in sync — copy this file for the next card and change it freely.
  Extracting the common parts is worth doing once several posts exist and the repetition
  is real rather than anticipated.

  Plots the subjects against every size peer with results on the same benchmark. A bare
  score is unreadable: "56.73" means nothing without knowing what a model of that size
  normally gets, so the peer set IS the interpretation.

  Form is emphasis (one hue + gray), not categorical: peers are context, not series
  competing for identity, so they are deliberately not color-coded.

  Models carry their full Hugging Face name, split across two lines at the "/".
  Abbreviating saves room but makes a claim harder to check against the leaderboard,
  and two models can abbreviate to the same string.

  This file is self-contained: fetch.py writes the numbers into #card-data below, and
  the copy lives in the COPY object further down. Open it in a browser and you see
  exactly what renders — there is no separate data file to fall out of sync with.

    .venv/bin/python posts/2026-08-06-bekko-size-class/fetch.py        # refresh the numbers
    uv run visuals/render.py --card posts/2026-08-06-bekko-size-class/card.html \
      --out posts/2026-08-06-bekko-size-class/card.png                 # ~3s
    uv run visuals/render.py --card posts/2026-08-06-bekko-size-class/card.html --mode dark \
      --out posts/2026-08-06-bekko-size-class/card.png

  Edit copy freely — it costs a re-render, not a re-fetch. Only re-run fetch.py when
  the cohort query itself changes, or before posting to confirm the numbers still hold.

  PALETTE IS A PLACEHOLDER — swap the :root block only.
-->

    /* --- swap these for MTEB brand values --- */
    --surface:        #fcfcfb;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --accent:         #3d7bff;
    --peer:           #b9b7b0;
    --gridline:       #e1e0d9;
    --axis:           #c3c2b7;
    --hairline:       rgba(11, 11, 11, 0.10);
    --font-sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  [data-mode="dark"] {
    --surface:        #1a1a19;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --accent:         #5b8fff;
    --peer:           #55534e;
    --gridline:       #2c2c2a;
    --axis:           #383835;
    --hairline:       rgba(255, 255, 255, 0.10);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 1200px; overflow: hidden;
    background: var(--surface); color: var(--text-primary);
    font-family: var(--font-sans);
    display: flex; flex-direction: column;
    padding: 44px 56px 32px;
  }

  header { display: flex; justify-content: space-between; align-items: flex-start; }
  .eyebrow {
    font-size: 18px; font-weight: 600; letter-spacing: 0.05em;
    text-transform: uppercase; color: var(--accent);
  }
  h1 { font-size: 46px; font-weight: 640; letter-spacing: -0.02em; margin-top: 10px; }
  .specs { font-size: 15px; color: var(--text-muted); margin-top: 8px; }
  .subtitle { font-size: 22px; color: var(--text-secondary); margin-top: 5px; }

  .brand { display: flex; align-items: center; gap: 12px; padding-top: 4px; }
  .brand-name {
    font-size: 30px; font-weight: 700; letter-spacing: 0.01em;
    color: var(--text-primary);
  }

  .plot { flex: 1; margin-top: 10px; display: flex; flex-direction: column; min-height: 0; }
  svg { width: 100%; height: 100%; display: block; overflow: visible; }

  /* Ranked rows. One grid so rank / name / track / value stay in columns and the
     axis ticks below line up with the track. */
  .bars { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 44px; }
  .row, .axis {
    display: grid;
    grid-template-columns: 38px 420px 1fr 84px;
    align-items: center; gap: 14px;
  }
  .rank {
    font-size: 17px; color: var(--text-muted); text-align: center;
    border: 1px solid var(--hairline); border-radius: 50%;
    width: 32px; height: 32px; line-height: 30px;
  }
  .row.subject .rank { color: var(--accent); border-color: var(--accent); font-weight: 650; }
  .row.reference .rank { border: none; }

  /* Three lines: org, model, size. Splitting them stops the long HF names wrapping
     mid-word and gives the parameter counts somewhere to live that is not a caption
     tacked onto the end of the name. */
  .mname { line-height: 1.2; }
  .mname .org { display: block; color: var(--text-muted); font-size: 15px; }
  .mname .name { display: block; font-size: 20px; color: var(--text-secondary); }
  .row.subject .mname .name { color: var(--text-primary); font-weight: 640; }
  .mname .size { display: block; color: var(--text-muted); font-size: 15px; }

  .track { height: 40px; position: relative; }
  .fill {
    position: absolute; left: 0; top: 0; bottom: 0;
    background: var(--peer); border-radius: 0 5px 5px 0;   /* rounded data-end */
  }
  .row.subject .fill { background: var(--accent); }
  /* The reference gets a 45-degree hatch rather than a solid fill: it is a scale marker,
     not a competitor, and texture reads as "different kind of thing" where a lighter
     solid would just read as "smaller number". 45 degrees is the texture convention. */
  .row.reference .fill {
    background-color: transparent;
    background-image: repeating-linear-gradient(45deg,
      var(--peer) 0 5px, transparent 5px 11px);
  }
  .val { font-size: 23px; color: var(--text-secondary); text-align: right; }
  .row.subject .val { color: var(--text-primary); font-weight: 640; }
  .row.reference .val { color: var(--text-muted); }
  .row.reference .mname .name { color: var(--text-muted); }

  .row.reference { border-bottom: 1px solid var(--hairline); padding-bottom: 18px; }

  .axis { margin-top: 8px; padding-top: 6px; row-gap: 4px; }
  .axis .ticks { position: relative; height: 16px; }
  .axis .ticks span {
    position: absolute; transform: translateX(-50%);
    font-size: 16px; color: var(--text-muted);
  }
  .axis .rule { grid-column: 3 / 4; height: 1px; background: var(--axis); }
  .axis-name { font-size: 17px; color: var(--text-secondary); font-weight: 550; text-align: center; }
  .grid { stroke: var(--gridline); stroke-width: 1; }
  .axis-line { stroke: var(--axis); stroke-width: 1; }
  .tick { fill: var(--text-muted); font-size: 15px; }
  .axis-title { fill: var(--text-secondary); font-size: 16px; font-weight: 550; }
  /* No surface ring on either dot: it was there to separate overlapping marks, but the
     points are well spread and over the shaded region the ring reads as a white halo. */
  .peer-dot { fill: var(--peer); }
  .subject-dot { fill: var(--accent); }
  .subject-label { fill: var(--text-primary); font-size: 18px; font-weight: 640; }
  .subject-org { fill: var(--text-secondary); font-size: 12px; }
  .subject-score { fill: var(--text-secondary); font-size: 17px; }
  .peer-label { fill: var(--text-muted); font-size: 14px; }
  .peer-org { fill: var(--text-muted); font-size: 10.5px; opacity: 0.8; }
  /* The frontier is drawn as a region, not a line: its top edge IS the boundary, so a
     separate stroke along it only restates what the shading already says. Slightly
     stronger than a pure background tint because it is now the sole marker. */
  .frontier-fill { fill: var(--accent); opacity: 0.09; stroke: none; }
  .zero-note { fill: var(--text-muted); font-size: 13px; font-style: italic; }

  footer {
    display: flex; justify-content: space-between; align-items: flex-end;
    margin-top: 12px; padding-top: 14px; border-top: 1px solid var(--hairline);
    font-size: 17px; color: var(--text-muted);
  }
  .foot-left { display: flex; flex-direction: column; gap: 5px; }
  footer .context { color: var(--text-secondary); font-weight: 550; }
  .source { font-size: 14px; color: var(--text-muted); }

  /* The dots icon is multi-colour with transparency, so it is drawn as an image rather
     than a mask — masking would flatten its blues to a single ink and lose the mark.
     Its own blues read on both surfaces, so no per-mode variant is needed. Embedded as
     a data URI because render.py renders from a temp directory, where a relative path
     would not resolve. */
  .logo {
    width: 39px; height: 41px; flex: none;   /* asset aspect 0.958 */
    background: var(--logo-uri) left center / contain no-repeat;
  }
</style>

<header>
  <div>
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="title"></h1>
    <!-- specs above the headline: the hard facts (languages, context, dims) frame the
         claim rather than trailing it as a footnote -->
    <div class="specs" id="specs"></div>
    <div class="subtitle" id="subtitle"></div>
  </div>
  <!-- Brand block, top right on every post. Replaces the legend: the subtitle already
       names the Pareto frontier, each dot carries its own model name, and the subjects
       are the only ones in accent with a score beside them — so the legend was
       restating what the card says elsewhere. -->
  <div class="brand">
    <span class="logo" role="img" aria-label="MTEB"></span>
    <span class="brand-name">MTEB</span>
  </div>
</header>

<div class="plot">
  <div class="bars" id="bars"></div>
  <div class="axis" id="axis"></div>
</div>

<footer>
  <!-- The cohort statement is no longer printed on the card. It still reaches the alt
       text, which describes the plot as covering N multilingual models under the size
       cap, so the scope survives for anyone reading the description. -->
  <div class="foot-left">
    <span class="source">Source · MTEB (leaderboard.mteb.org)</span>
  </div>
  <span id="footer"></span>
</footer>


<script>
// ---------------------------------------------------------------------------
// COPY — see card.html for why this is here and not in fetch.py.
// ---------------------------------------------------------------------------
const COPY = {
  eyebrow: "New model on MTEB",
  title: "Bekko",
  subtitle: "Top of its size class for multilingual models",
  specs: "110 languages · 8k context · Matryoshka 64–384",
  footer: "Contributed by hotchpotch",
  // the benchmark names the axis under the bars rather than crowding the headline
  axis_label: "MTEB(Multilingual, v2)",
};

const data = JSON.parse(document.getElementById("card-data").textContent);
const d = { ...COPY, ...data,
  context: `multilingual models ≤ ${Math.round(data.max_active_params / 1e6)}M active params` };

const set = (id, v) => { const n = document.getElementById(id); if (n) n.textContent = v ?? ""; };
set("eyebrow", d.eyebrow); set("title", d.title); set("subtitle", d.subtitle);
set("specs", d.specs); set("footer", d.footer);
if (d.mode === "dark") document.documentElement.dataset.mode = "dark";

// The reference is pulled out of the ranking: it is 280x over the size cap, so ranking
// it against the cohort would be the exact unfair comparison the cohort filter exists
// to prevent. It sits above the divider as scale, unnumbered.
const ranked = [...d.points].filter(p => !p.reference).sort((a, b) => b.y - a.y);
const reference = d.points.find(p => p.reference);
const pts = reference ? [reference, ...ranked] : ranked;

// Bars start at zero. The Arena reference this borrows from truncates its axis (1,450
// upward), which exaggerates small Elo gaps; on a 0-100 score, zero is meaningful and
// truncating would misstate the differences as far larger than they are. The cost is a
// less dramatic chart — the ranking and the printed values carry the detail instead.
const AXIS_MAX = Math.ceil(Math.max(...pts.map(p => p.y)) / 20) * 20;

const M = n => n >= 1e9 ? `${(n / 1e9).toFixed(1)}B` : `${(n / 1e6).toFixed(1)}M`;
const sizeLine = p => (p.x === 0
  ? `${M(p.total)} params · static`
  : `${M(p.total)} params · ${M(p.x)} active`)
  + (p.reference ? " · shown for scale" : "");
const splitName = n => {
  const i = n.indexOf("/");
  return i === -1 ? ["", n] : [n.slice(0, i + 1), n.slice(i + 1)];
};

let rank = 0;
document.getElementById("bars").innerHTML = pts.map(p => {
  const [org, name] = splitName(p.model);
  const cls = p.reference ? " reference" : p.subject ? " subject" : "";
  const badge = p.reference ? "" : ++rank;
  const row = `
    <div class="row${cls}">
      <span class="rank">${badge}</span>
      <span class="mname">
        <span class="org">${org}</span>
        <span class="name">${name}</span>
        <span class="size">${sizeLine(p)}</span>
      </span>
      <span class="track"><span class="fill" style="width:${(p.y / AXIS_MAX * 100).toFixed(2)}%"></span></span>
      <span class="val">${p.y.toFixed(2)}</span>
    </div>`;
  // divider marks where the size class begins; everything above it is scale only
  return row;
}).join("");

const ticks = [];
for (let v = 0; v <= AXIS_MAX; v += 20) ticks.push(v);
document.getElementById("axis").innerHTML = `
  <span></span><span></span>
  <span class="ticks">${ticks.map(v =>
    `<span style="left:${(v / AXIS_MAX * 100).toFixed(2)}%">${v}</span>`).join("")}</span>
  <span></span>
  <span></span><span></span>
  <span class="axis-name">${d.axis_label}</span>
  <span></span>`;

window.__altText = [
  `${d.eyebrow}: ${d.title} — ${d.subtitle}.`,
  `Bar chart ranking ${ranked.length} ${d.context} by score on ${d.benchmark}, ${d.n_tasks} tasks.`,
  ranked.map((p, i) => `${i + 1}. ${p.model}, ${p.y.toFixed(2)}, ${sizeLine(p)}`).join("; ") + ".",
  reference ? `Shown above for scale only, far outside the size class: ${reference.model}, ${reference.y.toFixed(2)}, ${sizeLine(reference)}.` : "",
  `${d.footer}. Source: MTEB, leaderboard.mteb.org.`,
].filter(Boolean).join(" ");
</script>
