<title>MTEB — banner (wordmark)</title>
<!--
  Account banner, 1500x500.

    uv run mteb-render --card brand/banner-wordmark.html --out brand/banner-wordmark.png --size banner

  Variant of brand/banner.html carrying the wordmark. Bluesky already prints the
  display name and handle under the avatar, so on the profile this repeats them; it
  earns its place only where the banner appears with no profile chrome around it — a
  slide, a README header, LinkedIn. Bottom right, because the frontier rises away
  from that corner and leaves it empty, and because it is diagonally clear of where
  the avatar overlaps.

  Every model with a score on MTEB(Multilingual, v2), placed by size and score, with the
  Pareto frontier drawn through it.

  THE RULE THAT SHAPES THIS FILE: no numbers, no model names, no axes, no legend.

  A banner is set once and then never looked at again, while every score on it keeps
  ageing. A snapshot with values on it would be quietly wrong within weeks — wrong on the
  one surface nobody thinks to re-check, which is the retraction AGENTS.md rule 1 exists
  to prevent. The frontier line is shape, not a claim: it says "smaller models keep
  catching up", which is the standing fact about this field rather than a result that
  expires. Re-fetch the points whenever; nothing downstream depends on which are here.

  THE DOTS CARRY THE MARK'S GRADIENT. The MTEB logo is blue dots shading from deep blue
  at the lower left to lighter blue at the upper right. The plot uses that same ramp
  across its width, so the banner reads as the logo's own visual language rather than as
  a chart that happens to sit above it. That is the whole reason it looks like us.

  Total parameters, not active: `totalParamsB` is a separate API field and so is untouched
  by the activeParamsB bug in issue.md. Unlabelled texture is also the one place where the
  choice carries no argument, since no comparison is being drawn.
-->

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1500px; height: 500px; }

         font-family: var(--font-sans); }
  #plot { position: absolute; inset: 0; }

  .mark {
    position: absolute; right: 78px; bottom: 78px;
    display: flex; align-items: center; gap: 15px;
  }
  .logo { width: 44px; height: 44px;
          background: var(--logo-uri) left center / contain no-repeat; }
  .name { font-size: 42px; font-weight: 640; letter-spacing: -0.022em;
          color: var(--text-primary); }

<svg id="plot" viewBox="0 0 1500 500"></svg>
<div class="mark">
  <span class="logo" role="img" aria-label="MTEB"></span>
  <span class="name">MTEB</span>
</div>

<script>
const d = JSON.parse(document.getElementById("card-data").textContent);
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("plot");

// Log x: sizes span 2M to 58B parameters, four and a half orders of magnitude. On a
// linear axis every model under a billion collapses onto the left edge.
const xs = d.points.map(p => p[0]), ys = d.points.map(p => p[1]);
const lo = Math.log10(Math.min(...xs)), hi = Math.log10(Math.max(...xs));
const y0 = Math.min(...ys), y1 = Math.max(...ys);

// BAND HEIGHT is deliberately shallow — 208px of the 500px frame. The plot is a stripe
// across the banner, not a chart filling it: a full-height scatter reads as a figure
// someone forgot to label, while a shallow band reads as texture with direction.
const TOP = 148, BAND = 208;
const X = v => 40 + (Math.log10(v) - lo) / (hi - lo) * 1420;
const Y = v => TOP + BAND - (v - y0) / (y1 - y0) * BAND;

const A = [0x20,0x8f,0xe0], B = [0x3b,0xb5,0xef];
const ramp = t => `rgb(${A.map((c,i) => Math.round(c + (B[i]-c)*t)).join(",")})`;

// Pareto frontier: the models nothing else beats on both size and score at once. Drawn
// as a staircase because that is what the data does — a smoothed curve would invent
// intermediate models, and the flat runs are the interesting part anyway.
const sorted = [...d.points].sort((a,b) => a[0]-b[0]);
const front = [];
let best = -Infinity;
for (const [x,y] of sorted) if (y > best) { best = y; front.push([x,y]); }

let path = "";
front.forEach(([x,y], i) => {
  path += i === 0 ? `M ${X(x).toFixed(1)} ${Y(y).toFixed(1)}`
                  : ` H ${X(x).toFixed(1)} V ${Y(y).toFixed(1)}`;
});
const line = document.createElementNS(NS, "path");
line.setAttribute("d", path);
line.setAttribute("fill", "none");
line.setAttribute("stroke", "url(#ramp)");
line.setAttribute("stroke-width", "2.5");
line.setAttribute("stroke-linejoin", "round");
line.setAttribute("opacity", "0.9");

const defs = document.createElementNS(NS, "defs");
defs.innerHTML =
  `<linearGradient id="ramp" x1="0" y1="0" x2="1" y2="0">
     <stop offset="0" stop-color="var(--mark-dark)"/>
     <stop offset="1" stop-color="var(--mark-light)"/>
   </linearGradient>`;
svg.appendChild(defs);
svg.appendChild(line);

const onFront = new Set(front.map(p => p.join()));
for (const [x, y] of d.points) {
  const t = (Math.log10(x) - lo) / (hi - lo);
  const hit = onFront.has([x,y].join());
  const c = document.createElementNS(NS, "circle");
  c.setAttribute("cx", X(x).toFixed(1));
  c.setAttribute("cy", Y(y).toFixed(1));
  // Frontier models sit slightly larger and fully opaque; everything else is the field
  // they are measured against, so it recedes.
  c.setAttribute("r", hit ? 4.5 : 2.5);
  c.setAttribute("fill", ramp(t));
  c.setAttribute("opacity", hit ? 1 : 0.42);
  svg.appendChild(c);
}

window.__altText =
  "MTEB banner: the MTEB wordmark beside a wide, shallow scatter of " + d.points.length + " models evaluated on "
  + "MTEB(Multilingual, v2), placed by parameter count and mean score, shading from deep "
  + "blue at the left to lighter blue at the right, with a stepped line tracing the "
  + "models nothing else beats on both size and score. Decorative — no axes or values.";
</script>
