    --surface:        #fcfcfb;

  }
  [data-mode="dark"] {
    --surface:        #1a1a19;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --accent:         #5b8fff;
    --peer:           #55534e;
    --gridline:       #2c2c2a;
    --axis:           #383835;
    --hairline:       rgba(255, 255, 255, 0.10);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 1200px; overflow: hidden;
    background: var(--surface); color: var(--text-primary);
    font-family: var(--font-sans);
    display: flex; flex-direction: column;
    padding: 44px 56px 32px;
  }

  header { display: flex; justify-content: space-between; align-items: flex-start; }
  .eyebrow {
    font-size: 18px; font-weight: 600; letter-spacing: 0.05em;
    text-transform: uppercase; color: var(--accent);
  }
  h1 { font-size: 46px; font-weight: 640; letter-spacing: -0.02em; margin-top: 10px; }
  .specs { font-size: 15px; color: var(--text-muted); margin-top: 8px; }
  .subtitle { font-size: 22px; color: var(--text-secondary); margin-top: 5px; }

  .brand { display: flex; align-items: center; gap: 12px; padding-top: 4px; }
  .brand-name {
    font-size: 30px; font-weight: 700; letter-spacing: 0.01em;
    color: var(--text-primary);
  }

  .plot { flex: 1; margin-top: 10px; display: flex; flex-direction: column; min-height: 0; }
  svg { width: 100%; height: 100%; display: block; overflow: visible; }

  /* Row height/gap assume ~10 rows on a 1200px canvas; trim both if top_n grows. */
  .bars { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 26px; }
  .row, .axis {
    display: grid;
    grid-template-columns: 38px 420px 1fr 84px;
    align-items: center; gap: 14px;
  }
  .rank {
    font-size: 16px; color: var(--text-muted); text-align: center;
    border: 1px solid var(--hairline); border-radius: 50%;
    width: 30px; height: 30px; line-height: 28px;
  }
  .row.subject .rank { color: var(--accent); border-color: var(--accent); font-weight: 650; }
  .row.prior .rank { color: var(--accent); border-color: var(--accent); opacity: 0.55; }

  .mname { line-height: 1.18; }
  .mname .org { display: block; color: var(--text-muted); font-size: 14px; }
  .mname .name { display: block; font-size: 19px; color: var(--text-secondary); }
  .row.subject .mname .name { color: var(--text-primary); font-weight: 640; }
  .row.prior .mname .name { color: var(--text-secondary); }
  .mname .size { display: block; color: var(--text-muted); font-size: 14px; }
  .mname .tag { display: block; color: var(--accent); font-size: 13px; font-weight: 600; opacity: 0.75; }

  .track { height: 34px; position: relative; }
  .fill {
    position: absolute; left: 0; top: 0; bottom: 0;
    background: var(--peer); border-radius: 0 5px 5px 0;
  }
  .row.subject .fill { background: var(--accent); }
  .row.prior .fill { background: var(--accent); opacity: 0.35; }
  .val { font-size: 21px; color: var(--text-secondary); text-align: right; }
  .row.subject .val { color: var(--text-primary); font-weight: 640; }
  .row.prior .val { color: var(--text-secondary); }

  .axis { margin-top: 8px; padding-top: 6px; row-gap: 4px; }
  .axis .ticks { position: relative; height: 16px; }
  .axis .ticks span {
    position: absolute; transform: translateX(-50%);
    font-size: 16px; color: var(--text-muted);
  }
  .axis .rule { grid-column: 3 / 4; height: 1px; background: var(--axis); }
  /* Two tiers. The axis says what is being measured — a benchmark name, nothing else —
     and the scope that bounds the claim sits under it in the muted role. Both belong on
     the image, because a screenshot travels without the post (docs/card-design.md), but
     stacking them into one sentence turned the axis into a paragraph nobody reads. */
  .axis-name { display: block; font-size: 19px; color: var(--text-secondary); font-weight: 600; text-align: center; }
  .axis-note { display: block; font-size: 15px; color: var(--text-muted); text-align: center; margin-top: 5px; }

  footer {
    display: flex; justify-content: space-between; align-items: flex-end;
    margin-top: 12px; padding-top: 14px; border-top: 1px solid var(--hairline);
    font-size: 17px; color: var(--text-muted);
  }
  .foot-left { display: flex; flex-direction: column; gap: 5px; }
  .source { font-size: 14px; color: var(--text-muted); }

  .logo {
    width: 39px; height: 41px; flex: none;
    background: var(--logo-uri) left center / contain no-repeat;
  }
</style>

<header>
  <div>
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="title"></h1>
    <div class="specs" id="specs"></div>
    <div class="subtitle" id="subtitle"></div>
  </div>
  <div class="brand">
    <span class="logo" role="img" aria-label="MTEB"></span>
    <span class="brand-name">MTEB</span>
  </div>
</header>

<div class="plot">
  <div class="bars" id="bars"></div>
  <div class="axis" id="axis"></div>
</div>

<footer>
  <div class="foot-left">
    <span class="source">Source · MTEB (leaderboard.mteb.org)</span>
  </div>
  <span id="footer"></span>
</footer>

<script>
const COPY = {
  eyebrow: "New model on MTEB",     // TODO
  title: "TODO — model family name",
  specs: "TODO — one line on what the model is, or delete the element",
  subtitle: "TODO — the claim this ranking makes (e.g. '1st of N on ...')",
  footer: "TODO — Contributed by <github-handle>",
  axis_label: "TODO — the benchmark name alone, e.g. 'MTEB(Multilingual, v2)'",
  axis_note: "TODO — the scope under it, e.g. 'N tasks · top 10 of M models with complete results'",
};

const d = { ...COPY, ...JSON.parse(document.getElementById("card-data").textContent) };
const set = (id, v) => { const n = document.getElementById(id); if (n) n.textContent = v ?? ""; };
set("eyebrow", d.eyebrow); set("title", d.title); set("subtitle", d.subtitle);
set("specs", d.specs); set("footer", d.footer);
if (d.mode === "dark") document.documentElement.dataset.mode = "dark";

const rows = d.rows;
const AXIS_MAX = Math.ceil(Math.max(...rows.map(r => r.score)) / 20) * 20;

const splitName = n => {
  const i = n.indexOf("/");
  return i === -1 ? ["", n] : [n.slice(0, i + 1), n.slice(i + 1)];
};
// `params` is in the same unit fetch.py chose (active or total parameter count, in
// whichever scale — bars_card_data() passes raw counts, so format from a count here).
const fmtSize = n => n == null ? "size not published"
  : n === 0 ? "static (no active parameters)"
  : n >= 1e9 ? `${(n/1e9).toFixed(n >= 1e10 ? 0 : 1)}B parameters`
  : n >= 1e6 ? `${(n/1e6).toFixed(0)}M parameters`
  : `${(n/1e3).toFixed(0)}K parameters`;
const tagLine = r => r.subject ? "this release" : r.prior ? "same lab, previous generation" : "";

document.getElementById("bars").innerHTML = rows.map((r, i) => {
  const [org, name] = splitName(r.model);
  const cls = r.subject ? " subject" : r.prior ? " prior" : "";
  const tag = tagLine(r);
  return `
    <div class="row${cls}">
      <span class="rank">${r.rank ?? i + 1}</span>
      <span class="mname">
        <span class="org">${org}</span>
        <span class="name">${name}</span>
        <span class="size">${fmtSize(r.params)}</span>
        ${tag ? `<span class="tag">${tag}</span>` : ""}
      </span>
      <span class="track"><span class="fill" style="width:${(r.score / AXIS_MAX * 100).toFixed(2)}%"></span></span>
      <span class="val">${r.score.toFixed(2)}</span>
    </div>`;
}).join("");

const ticks = [];
for (let v = 0; v <= AXIS_MAX; v += 20) ticks.push(v);
document.getElementById("axis").innerHTML = `
  <span></span><span></span>
  <span class="ticks">${ticks.map(v =>
    `<span style="left:${(v / AXIS_MAX * 100).toFixed(2)}%">${v}</span>`).join("")}</span>
  <span></span>
  <span></span><span></span>
  <span><span class="axis-name">${d.axis_label}</span>
        <span class="axis-note">${d.axis_note}</span></span>
  <span></span>`;

window.__altText = [
  `${d.eyebrow}: ${d.title} — ${d.subtitle}.`,
  // "top N" only reads correctly when the rows are the top N. A subject appended from
  // outside top_n makes that false, so the count describes the rows and the per-row
  // ranks carry the positions.
  `Bar chart of ${rows.length} of the ${d.n_models} models with complete results on ${d.benchmark} (${d.n_tasks} tasks), each row given with its rank on that board.`,
  rows.map((r, i) => {
    const tag = tagLine(r);
    return `${r.rank ?? i + 1}. ${r.model}, ${r.score.toFixed(2)}, ${fmtSize(r.params)}${tag ? ` (${tag})` : ""}`;
  }).join("; ") + ".",
  `${d.footer}. Source: MTEB, leaderboard.mteb.org.`,
].join(" ");
</script>
