  [data-mode="dark"] {
    --surface:        #1a1a19;

    --text-secondary: #c3c2b7;

    --accent:         #5b8fff;
    --subject:        #5b8fff;
    --highlight:      #a06bff;

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 1200px; overflow: hidden;
    background: var(--surface); color: var(--text-primary);
    font-family: var(--font-sans);
    display: flex; flex-direction: column;
    padding: 44px 56px 32px;
  }

  header { display: flex; justify-content: space-between; align-items: flex-start; }
  .eyebrow {
    font-size: 18px; font-weight: 600; letter-spacing: 0.05em;
    text-transform: uppercase; color: var(--accent);
  }
  h1 { font-size: 46px; font-weight: 640; letter-spacing: -0.02em; margin-top: 10px; }
  .subtitle { font-size: 22px; color: var(--text-secondary); margin-top: 4px; }
  .specs { font-size: 15px; color: var(--text-muted); margin-top: 6px; }

  .brand { display: flex; align-items: center; gap: 12px; padding-top: 4px; }
  .brand-name {
    font-size: 30px; font-weight: 700; letter-spacing: 0.01em;
    color: var(--text-primary);
  }

  .plot { flex: 1; margin-top: 6px; }
  svg { width: 100%; height: 100%; display: block; overflow: visible; }

  .web { stroke: var(--gridline); fill: none; stroke-width: 1; }
  .spoke { stroke: var(--gridline); stroke-width: 1; }
  .ring-label { fill: var(--text-muted); font-size: 12px; }
  .axis-name { fill: var(--text-secondary); font-size: 15px; font-weight: 550; }
  .axis-count { fill: var(--text-muted); font-size: 12.5px; }
  .series-line { fill: none; stroke-width: 2.5; stroke-linejoin: round; }
  .series-dot { r: 4; }

  .rlegend {
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: 8px 22px; margin-top: 2px;
  }
  .rlegend div { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .rlegend .sw { width: 20px; height: 3px; border-radius: 2px; flex: none; }
  .rlegend .nm { color: var(--text-secondary); }
  .rlegend .size { color: var(--text-muted); font-size: 12.5px; }

  footer {
    display: flex; justify-content: space-between; align-items: flex-end;
    margin-top: 12px; padding-top: 14px; border-top: 1px solid var(--hairline);
    font-size: 17px; color: var(--text-muted);
  }
  .foot-left { display: flex; flex-direction: column; gap: 5px; }
  .source { font-size: 14px; color: var(--text-muted); }

  .logo {
    width: 39px; height: 41px; flex: none;
    background: var(--logo-uri) left center / contain no-repeat;
  }

    <span class="source">Source · MTEB (leaderboard.mteb.org)</span>
  </div>
  <span id="footer"></span>
</footer>

<script>
// ---------------------------------------------------------------------------
// COPY — see card-pareto.html for why this is here and not in fetch.py.
// ---------------------------------------------------------------------------
const COPY = {
  eyebrow: "New model on MTEB",     // TODO
  title: "TODO — model family name",
  specs: "TODO — languages · context · dims, or delete the element if not applicable",
  footer: "TODO — Contributed by <github-handle>",
};

const d = { ...COPY, ...JSON.parse(document.getElementById("card-data").textContent) };
const set = (id, v) => { const n = document.getElementById(id); if (n) n.textContent = v ?? ""; };

// The subtitle is built from the data whenever a "highlight" role exists, because the
// whole point of this card is the pair it compares — a hand-written line would drift
// the moment either score moves. Delete this block and set COPY.subtitle by hand if
// there is no single highlight rival (e.g. subject vs several reference peers only).
const SUB = d.series.find(s => s.role === "subject");
const HI = d.series.find(s => s.role === "highlight");
if (SUB && HI) {
  const gap = Math.abs(SUB.mean - HI.mean).toFixed(2);
  const shrink = HI.active && SUB.active ? (HI.active / SUB.active) : null;
  d.subtitle = SUB.mean >= HI.mean
    ? `Beats ${HI.model.split("/").pop()} by ${gap}` + (shrink ? ` at ${shrink.toFixed(1)}× fewer active parameters` : "")
    : `Matches ${HI.model.split("/").pop()} within ${gap}` + (shrink ? ` at ${shrink.toFixed(1)}× fewer active parameters` : "");
}
set("eyebrow", d.eyebrow); set("title", d.title); set("subtitle", d.subtitle);
set("specs", d.specs); set("footer", d.footer);
if (d.mode === "dark") document.documentElement.dataset.mode = "dark";

const ROLE_COLOR = {
  subject: "var(--subject)", highlight: "var(--highlight)", reference: "var(--context)",
};
const colorOf = s => ROLE_COLOR[s.role];
const M = n => n == null ? "size unknown" : n >= 1e9 ? `${(n / 1e9).toFixed(1)}B` : `${(n / 1e6).toFixed(0)}M`;

document.getElementById("rlegend").innerHTML = d.series.map(s => `
  <div>
    <span class="sw" style="background:${colorOf(s)}"></span>
    <span class="nm">${s.model}</span>
    <span class="size">${M(s.active)} active</span>
  </div>`).join("");

const svg = document.getElementById("plot");
const box = svg.getBoundingClientRect();
const W = Math.round(box.width), H = Math.round(box.height);
svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
const el = (t, a, txt) => {
  const n = document.createElementNS("http://www.w3.org/2000/svg", t);
  for (const k in a) n.setAttribute(k, a[k]);
  if (txt != null) n.textContent = txt;
  svg.appendChild(n); return n;
};

// Radial scale starts at zero — a radar with a truncated centre exaggerates every
// difference, and area is already an over-readable channel. Values are 0-100 scores
// (MTEB main scores are percentages), so the ring scale is fixed rather than fit to data
// — fitting it would make two posts' radars visually incomparable for no reason.
const RMAX = 80, RINGS = [20, 40, 60, 80];
const cx = W / 2, cy = H / 2 + 4;
const R = Math.min(H / 2 - 20, W / 2 - 185);
const axes = d.axes;
const ang = i => (i / axes.length) * 2 * Math.PI - Math.PI / 2;
const P = (i, v) => [cx + Math.cos(ang(i)) * R * (v / RMAX),
                     cy + Math.sin(ang(i)) * R * (v / RMAX)];

for (const ring of RINGS) {
  el("polygon", {
    class: "web",
    points: axes.map((_, i) => P(i, ring).join(",")).join(" "),
  });
}
axes.forEach((_, i) => {
  const [x, y] = P(i, RMAX);
  el("line", { class: "spoke", x1: cx, y1: cy, x2: x, y2: y });
});
for (const ring of RINGS.slice(0, -1)) {
  el("text", { class: "ring-label", x: cx + 6, y: cy - R * (ring / RMAX) - 4 }, ring);
}

axes.forEach((a, i) => {
  const [x, y] = P(i, RMAX);
  const dx = x - cx, dy = y - cy;
  const anchor = Math.abs(dx) < 6 ? "middle" : dx > 0 ? "start" : "end";
  const lx = x + (anchor === "middle" ? 0 : dx > 0 ? 12 : -12);
  const ly = y + (Math.abs(dx) < 6 ? (dy > 0 ? 20 : -10) : 4);
  el("text", { class: "axis-name", x: lx, y: ly, "text-anchor": anchor }, a.name);
  el("text", { class: "axis-count", x: lx, y: ly + 16, "text-anchor": anchor },
     a.n_tasks === 1 ? "1 task" : `${a.n_tasks} tasks`);
});

const ORDER = { reference: 0, highlight: 1, subject: 2 };
[...d.series].sort((a, b) => ORDER[a.role] - ORDER[b.role]).forEach(s => {
  const pts = s.values.map((v, j) => P(j, Math.max(0, v)).join(",")).join(" ");
  const isCtx = s.role === "reference";
  el("polygon", {
    class: "series-line", points: pts, stroke: colorOf(s),
    "stroke-width": isCtx ? 1.75 : 2.75, opacity: isCtx ? 0.75 : 1,
  });
  if (!isCtx) s.values.forEach((v, j) => {
    const [x, y] = P(j, Math.max(0, v));
    el("circle", { class: "series-dot", cx: x, cy: y, fill: colorOf(s) });
  });
});

window.__altText = [
  `${d.eyebrow}: ${d.title} — ${d.subtitle}.`,
  `Radar chart over ${axes.length} ${axes.length === 1 || axes[0].n_tasks > 1 ? "task types" : "tasks"} on ${d.benchmark}: ` +
    axes.map(a => `${a.name} (${a.n_tasks} tasks)`).join(", ") + ".",
  d.series.map(s =>
    `${s.model} (${M(s.active)} active, mean ${(s.mean ?? 0).toFixed(2)}): ` +
    axes.map((a, j) => `${a.name} ${s.values[j].toFixed(1)}`).join(", ")).join(". ") + ".",
  d.excluded_axes.length
    ? `${d.excluded_axes.join(", ")} excluded: its centered metric can be negative and has no position on a zero-based radial axis.`
    : "",
  `${d.footer}. Source: MTEB, leaderboard.mteb.org.`,
].filter(Boolean).join(" ");
</script>
