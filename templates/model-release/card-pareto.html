  subject is non-dominated: nothing both smaller and higher-scoring exists among peers).

  Copy this file into the new post's folder as card-1-<slug>.html (or card-N-<slug>.html
  for thread part N), fill in COPY below, and write #card-data with
  mtebpost.model_release.pareto_card_data(cohort). Everything else — axis scaling, the
  static/zero break, label collision avoidance, frontier shading, alt text — is generic
  and does not need editing.

  Form is emphasis (one hue + gray), not categorical: peers are context, not series
  competing for identity, so they are deliberately not color-coded. Models carry their
  full Hugging Face name, split across two lines at the "/" — an abbreviation saves room
  but makes a claim harder to check against the leaderboard, and two models can
  abbreviate to the same string.

    uv run posts/<stage>/<id>/fetch.py
    uv run mteb-render --card posts/<stage>/<id>/card-1-<slug>.html \
      --out posts/<stage>/<id>/card-1-<slug>.png

-->

<script>
// ---------------------------------------------------------------------------
// COPY. Every sentence a human chose lives here, not in fetch.py, so editing a
// word costs a re-render (seconds) rather than a re-fetch (minutes).
// #card-data above supplies only query-derived values, written there by fetch.py.
// ---------------------------------------------------------------------------
const COPY = {
  eyebrow: "New model on MTEB",     // TODO
  title: "TODO — model family name",
  subtitle: "TODO — the claim this scatter makes (e.g. 'A new Pareto frontier for ...')",
  specs: "TODO — languages · context · dims, or delete the element if not applicable",
  x_label: "Active parameters",
  footer: "TODO — Contributed by <github-handle>",
};

// Per-model label placement overrides, keyed by full model name — presentation, same
// rule as the copy above. Use when the automatic left/right split collides two labels.
const LABEL_SIDE = {
  // "org/model-name": "left",
};

const data = JSON.parse(document.getElementById("card-data").textContent);
const d = {
  ...COPY,
  ...data,
  y_label: data.benchmark,
  context: `models ≤ ${Math.round(data.max_active_params / 1e6)}M active params`,
};
const set = (id, v) => {
  const n = document.getElementById(id);
  if (n) n.textContent = v ?? "";
};
set("eyebrow", d.eyebrow); set("title", d.title); set("subtitle", d.subtitle);
set("specs", d.specs);
set("footer", d.footer);
if (d.mode === "dark") document.documentElement.dataset.mode = "dark";

const svgEl = document.getElementById("plot");
const box = svgEl.getBoundingClientRect();
const W = Math.round(box.width), H = Math.round(box.height);
svgEl.setAttribute("viewBox", `0 0 ${W} ${H}`);

const M = { t: 30, r: 24, b: 58, l: 58 };
const pts = d.points.filter(p => !p.reference);

const hasZero = pts.some(p => p.x === 0);
const ZERO_W = hasZero ? 74 : 0;
const BREAK_W = hasZero ? 26 : 0;

const nz = pts.filter(p => p.x > 0);
const xs = nz.map(p => Math.log10(p.x)), ys = pts.map(p => p.y);
const xmin = Math.floor(Math.min(...xs) * 2) / 2 - 0.15;
const xmax = Math.ceil(Math.max(...xs) * 2) / 2 + 0.15;
const pad = Math.max(2, (Math.max(...ys) - Math.min(...ys)) * 0.18);
const ymin = Math.min(...ys) - pad, ymax = Math.max(...ys) + pad;

const LOG_L = M.l + ZERO_W + BREAK_W;
const X = v => v === 0
  ? M.l + ZERO_W / 2
  : LOG_L + (Math.log10(v) - xmin) / (xmax - xmin) * (W - LOG_L - M.r);
const Y = v => H - M.b - (v - ymin) / (ymax - ymin) * (H - M.t - M.b);

const fmt = n => n === 0 ? "0 (static)"
  : n >= 1e9 ? (n/1e9) + "B" : n >= 1e6 ? Math.round(n/1e6) + "M" : Math.round(n/1e3) + "K";
const svg = svgEl;
const el = (t, a, txt) => {
  const n = document.createElementNS("http://www.w3.org/2000/svg", t);
  for (const k in a) n.setAttribute(k, a[k]);
  if (txt != null) n.textContent = txt;
  svg.appendChild(n); return n;
};

const yStep = (ymax - ymin) > 30 ? 10 : (ymax - ymin) > 12 ? 5 : 2;
for (let v = Math.ceil(ymin / yStep) * yStep; v <= ymax; v += yStep) {
  el("line", { x1: M.l, x2: W - M.r, y1: Y(v), y2: Y(v), class: "grid" });
  el("text", { x: M.l - 12, y: Y(v) + 5, class: "tick", "text-anchor": "end" }, v);
}
const decades = [];
for (let e = Math.ceil(xmin); e <= Math.floor(xmax); e++) decades.push(Math.pow(10, e));
let xticks = decades;
if (decades.length < 3) {
  xticks = [];
  for (let e = Math.floor(xmin); e <= Math.ceil(xmax); e++) {
    for (const m of [1, 2, 5]) {
      const v = m * Math.pow(10, e);
      const lv = Math.log10(v);
      if (lv >= xmin && lv <= xmax) xticks.push(v);
    }
  }
}
for (const v of xticks) {
  el("text", { x: X(v), y: H - M.b + 26, class: "tick", "text-anchor": "middle" }, fmt(v));
}
if (hasZero) {
  el("text", { x: X(0), y: H - M.b + 26, class: "tick", "text-anchor": "middle" }, "0");
  el("text", { x: X(0), y: H - M.b + 44, class: "zero-note", "text-anchor": "middle" }, "static");
}
el("line", { x1: M.l, x2: W - M.r, y1: H - M.b, y2: H - M.b, class: "axis-line" });
if (hasZero) {
  const bx = M.l + ZERO_W + BREAK_W / 2, by = H - M.b;
  el("rect", { x: bx - 9, y: by - 6, width: 18, height: 12, fill: "var(--surface)" });
  for (const dx of [-4, 3]) {
    el("line", { x1: bx + dx, y1: by + 7, x2: bx + dx + 6, y2: by - 7, class: "axis-line" });
  }
}
el("text", { x: (M.l + W - M.r) / 2, y: H - 8, class: "axis-title", "text-anchor": "middle" }, d.x_label);
el("text", { x: 0, y: 12, class: "axis-title", "text-anchor": "start" }, d.y_label);

// Pareto frontier: the models no other model beats on both axes at once. Drawn as a
// staircase, not a straight line between points, because that is the actual boundary
// of what has been achieved: at a given size you can have the best score at or below
// that size, not an interpolation between two models nobody has trained.
const frontier = [...pts]
  .sort((a, b) => a.x - b.x || b.y - a.y)
  .reduce((acc, p) => {
    if (!acc.length || p.y > acc[acc.length - 1].y) acc.push(p);
    return acc;
  }, []);

if (frontier.length > 1) {
  const X0 = M.l, X1 = W - M.r;
  const last = frontier[frontier.length - 1];
  let path = `M ${X0} ${Y(frontier[0].y)} L ${X(frontier[0].x)} ${Y(frontier[0].y)}`;
  for (let i = 1; i < frontier.length; i++) {
    path += ` L ${X(frontier[i].x)} ${Y(frontier[i - 1].y)}`;
    path += ` L ${X(frontier[i].x)} ${Y(frontier[i].y)}`;
  }
  path += ` L ${X1} ${Y(last.y)}`;
  const floor = H - M.b;
  el("path", { d: `${path} L ${X1} ${floor} L ${X0} ${floor} Z`, class: "frontier-fill" });
}

const splitName = n => {
  const i = n.indexOf("/");
  return i === -1 ? [null, n] : [n.slice(0, i + 1), n.slice(i + 1)];
};

// Place a multi-line label above a point, always anchored *to the point* and running
// inward. Widths are measured after insertion rather than estimated from character
// count, because a guess is wrong exactly for the long HF names this card is full of.
const labelBlock = (x, lines, side) => {
  const anchor = (side ?? (x > W / 2 ? "right" : "left")) === "right" ? "end" : "start";
  const els = lines.map(l =>
    el("text", { x, y: l.y, class: l.cls, "text-anchor": anchor }, l.txt)
  );
  const w = Math.max(...els.map(t => t.getComputedTextLength()));
  let lx = x;
  if (anchor === "start" && x + w > W - 2) lx = Math.max(2, W - 2 - w);
  if (anchor === "end" && x - w < 2) lx = Math.min(W - 2, 2 + w);
  if (lx !== x) for (const t of els) t.setAttribute("x", lx);
};

const peers = pts.filter(p => !p.subject);
const namePeers = peers.length <= 6;
for (const p of peers) {
  el("circle", { cx: X(p.x), cy: Y(p.y), r: 5, class: "peer-dot" });
  if (!namePeers) continue;
  const [org, name] = splitName(p.model);
  labelBlock(X(p.x), [
    ...(org ? [{ txt: org, cls: "peer-org", y: Y(p.y) - 26 }] : []),
    { txt: name, cls: "peer-label", y: Y(p.y) - 12 },
  ]);
}
for (const p of pts.filter(p => p.subject)) {
  el("circle", { cx: X(p.x), cy: Y(p.y), r: 7.5, class: "subject-dot" });
  const [org, name] = splitName(p.model);
  const right = LABEL_SIDE[p.model] ? LABEL_SIDE[p.model] === "left" : X(p.x) > W / 2;
  const lx = X(p.x) + (right ? -14 : 14);
  const a = { x: lx, "text-anchor": right ? "end" : "start" };
  if (org) el("text", { ...a, y: Y(p.y) - 26, class: "subject-org" }, org);
  el("text", { ...a, y: Y(p.y) - 8, class: "subject-label" }, name);
  el("text", { ...a, y: Y(p.y) + 13, class: "subject-score" }, p.y.toFixed(2));
}

window.__altText = [
  `${d.eyebrow}: ${d.title} — ${d.subtitle}.`,
  `Scatter plot of ${d.y_label} against ${d.x_label} for ${pts.length} ${d.context}.`,
  pts.filter(p => p.subject)
     .map(p => `${p.model} scores ${p.y.toFixed(2)} at ${fmt(p.x)} active parameters`)
     .join("; ") + ".",
  peers.length
    ? "Compared against " + peers.map(p => `${p.model} at ${fmt(p.x)}, ${p.y.toFixed(2)}`).join("; ") + "."
    : "",
  frontier.length > 1
    ? "On the Pareto frontier (nothing is both smaller and higher-scoring): "
      + frontier.map(p => p.model).join(", ") + "."
    : "",
  `${d.footer}.`,
  "Source: MTEB, leaderboard.mteb.org."
].filter(Boolean).join(" ");
</script>
