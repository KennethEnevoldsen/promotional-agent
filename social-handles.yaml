# GitHub handle -> social handle mapping, for credit lines in posts.
#
# Credit is not optional: every post names the people whose work it describes.
# Tagging is. A `bluesky:` entry is an opt-in signal — the agent may @-mention that
# handle. With no entry, the post still credits the person by their GitHub handle as
# plain text, which is a statement of fact rather than a notification.
#
# Do not guess a Bluesky handle from a name or a GitHub profile. Wrong-person mentions
# are the exact failure mode that makes an automated account feel spammy. Populate this
# file only from handles people have volunteered.
#
# `via:` records what counts as volunteering, and is required wherever `bluesky:` is set.
# Two things qualify:
#
#   * the person said so directly, to a maintainer or to the account;
#   * the person quoted or replied to a post *about their own work* from that handle.
#     Publicly attaching your name to coverage of your own model is a fair signal that a
#     mention is wanted. Commenting on someone else's is not — that is a reader, and
#     tagging readers is how an account starts feeling like spam.
#
# Being findable is not volunteering. If the only evidence is that a handle exists and
# looks like the right person, the entry stays null and the post credits by GitHub handle.
#
# affiliation is optional and used only where the org is the more natural credit
# (e.g. a lab releasing a model family).

