# GitHub handle -> social handle mapping, for credit lines in posts.
#
# Credit is not optional: every post names the people whose work it describes.
# Tagging needs an entry here. A `bluesky:` entry means the agent may @-mention that
# handle. With no entry, the post still credits the person by their GitHub handle as
# plain text.
#
# `via:` records where the handle came from, and is required wherever `bluesky:` or
# `linkedin:` is set. Three sources qualify:
#
#   * the person links it from their own GitHub profile (`gh api users/<h>/social_accounts`,
#     or the profile's website or bio). They published it themselves. Record the date
#     checked;
#   * the person said so directly, to a maintainer or to the account;
#   * the person quoted or replied to a post about their own work from that handle.
#
# Never infer a handle any other way: not by searching Bluesky or LinkedIn for a name,
# and not because an account looks like the right person. Wrong-person mentions are the
# failure mode that makes an automated account feel spammy.
#
# `linkedin:` is a profile URL and follows the same rules, for the LinkedIn version of a
# post. See CONTRIBUTING.md, "Credit".
#
# affiliation is optional and used only where the org is the more natural credit
# (e.g. a lab releasing a model family).

